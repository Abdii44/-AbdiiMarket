<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdii Market — Fashion Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f8;
  color:#111;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  color:white;
  padding:15px;
  box-shadow:0 3px 15px #0003;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:22px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:#d4af37;
}

.cartBtn{
  border:0;
  background:#d4af37;
  color:#111;
  padding:11px 15px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111,#292929);
  color:white;
  padding:45px 18px;
  text-align:center;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  color:#ddd;
  margin-bottom:22px;
}

.searchBox{
  max-width:650px;
  margin:auto;
  display:flex;
  background:white;
  border-radius:15px;
  overflow:hidden;
}

.searchBox input{
  flex:1;
  border:0;
  padding:16px;
  font-size:16px;
  outline:none;
}

.searchBox button{
  width:55px;
  border:0;
  background:#d4af37;
  cursor:pointer;
  font-size:20px;
}

.filters{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:11px;
  background:white;
  font-size:14px;
}

.section{
  max-width:1200px;
  margin:auto;
  padding:0 15px 40px;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0;
}

.sectionTitle h2{
  font-size:22px;
}

.count{
  color:#777;
  font-size:14px;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card{
  background:white;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 3px 15px #0000000d;
  transition:.2s;
  position:relative;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 25px #0002;
}

.productImage{
  height:235px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:zoom-in;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#eee,#fafafa);
}

.productImage .emoji{
  font-size:100px;
  filter:drop-shadow(0 8px 8px #0002);
  transition:.25s;
}

.productImage:hover .emoji{
  transform:scale(1.08);
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#111;
  color:white;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
}

.cardBody{
  padding:14px;
}

.category{
  color:#888;
  font-size:12px;
  margin-bottom:5px;
}

.name{
  font-size:16px;
  font-weight:bold;
  margin-bottom:8px;
}

.price{
  color:#b38b00;
  font-size:18px;
  font-weight:800;
  margin-bottom:10px;
}

.meta{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.tag{
  background:#f1f1f1;
  padding:5px 7px;
  border-radius:7px;
  font-size:11px;
}

.addBtn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.addBtn:hover{
  background:#d4af37;
  color:#111;
}

.empty{
  text-align:center;
  padding:50px;
  color:#777;
  grid-column:1/-1;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.active{
  display:flex;
}

.modalBox{
  background:white;
  max-width:500px;
  width:100%;
  border-radius:20px;
  padding:18px;
  position:relative;
}

.close{
  position:absolute;
  right:12px;
  top:10px;
  border:0;
  background:#111;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
}

.zoomImage{
  height:400px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f3f3;
  border-radius:15px;
}

.zoomImage .emoji{
  font-size:180px;
}

.cartPanel{
  position:fixed;
  right:-420px;
  top:0;
  width:400px;
  max-width:95%;
  height:100%;
  background:white;
  z-index:600;
  box-shadow:-5px 0 25px #0003;
  transition:.3s;
  display:flex;
  flex-direction:column;
}

.cartPanel.open{
  right:0;
}

.cartHeader{
  padding:18px;
  background:#111;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cartItems{
  flex:1;
  overflow:auto;
  padding:15px;
}

.cartItem{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cartEmoji{
  width:60px;
  height:60px;
  background:#f3f3f3;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  font-size:32px;
}

.cartInfo{
  flex:1;
}

.cartInfo strong{
  display:block;
  margin-bottom:5px;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button{
  width:27px;
  height:27px;
  border:0;
  border-radius:6px;
  background:#111;
  color:white;
  cursor:pointer;
}

.remove{
  border:0;
  background:none;
  color:#d00;
  cursor:pointer;
  margin-left:8px;
}

.cartFooter{
  padding:18px;
  border-top:1px solid #ddd;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.checkout{
  width:100%;
  border:0;
  background:#d4af37;
  padding:14px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
}

footer{
  background:#111;
  color:white;
  padding:35px 15px;
  text-align:center;
}

@media(max-width:900px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }

  .filters{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .header{
    flex-wrap:wrap;
  }

  .logo{
    font-size:19px;
  }

  .hero{
    padding:35px 14px;
  }

  .hero h1{
    font-size:27px;
  }

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .productImage{
    height:180px;
  }

  .productImage .emoji{
    font-size:72px;
  }

  .cardBody{
    padding:10px;
  }

  .name{
    font-size:14px;
  }

  .price{
    font-size:16px;
  }

  .cartPanel{
    width:100%;
    max-width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">Abdii <span>Market</span></div>

    <button class="cartBtn" onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</header>

<section class="hero">
  <h1>✨ Abdii Fashion Market</h1>
  <p>Fashion products for everyone</p>

  <div class="searchBox">
    <input
      id="search"
      type="search"
      placeholder="Search product, color, category..."
      oninput="renderProducts()"
    >
    <button onclick="renderProducts()">🔎</button>
  </div>
</section>

<div class="filters">

  <select id="category" onchange="renderProducts()">
    <option value="all">All Categories</option>
    <option value="clothes">👕 Clothes</option>
    <option value="shoes">👟 Shoes</option>
    <option value="pants">👖 Pants</option>
    <option value="glasses">🕶️ Eye Glass</option>
    <option value="watch">⌚ Watch</option>
    <option value="necklace">📿 Necklace</option>
    <option value="bag">👜 Bag</option>
  </select>

  <select id="gender" onchange="renderProducts()">
    <option value="all">All Gender</option>
    <option value="male">👨 Men</option>
    <option value="female">👩 Women</option>
  </select>

  <select id="color" onchange="renderProducts()">
    <option value="all">All Colors</option>
    <option>Black</option>
    <option>White</option>
    <option>Red</option>
    <option>Blue</option>
    <option>Green</option>
    <option>Yellow</option>
    <option>Pink</option>
    <option>Purple</option>
    <option>Brown</option>
    <option>Gold</option>
    <option>Silver</option>
  </select>

  <select id="sort" onchange="renderProducts()">
    <option value="default">Sort Products</option>
    <option value="low">Price: Low → High</option>
    <option value="high">Price: High → Low</option>
  </select>

</div>

<section class="section">

  <div class="sectionTitle">
    <h2>🛍️ Fashion Collection</h2>
    <span class="count" id="count"></span>
  </div>

  <div class="products" id="products"></div>

</section>

<!-- IMAGE ZOOM -->

<div class="modal" id="imageModal" onclick="closeImage()">

  <div class="modalBox" onclick="event.stopPropagation()">

    <button class="close" onclick="closeImage()">×</button>

    <div class="zoomImage">
      <div class="emoji" id="zoomEmoji">👕</div>
    </div>

    <h2 id="zoomName" style="margin-top:15px"></h2>
    <p id="zoomPrice" style="margin-top:7px;color:#b38b00;font-weight:bold"></p>

  </div>

</div>

<!-- CART -->

<div class="cartPanel" id="cartPanel">

  <div class="cartHeader">
    <h2>🛒 Your Cart</h2>
    <button class="close" onclick="closeCart()">×</button>
  </div>

  <div class="cartItems" id="cartItems"></div>

  <div class="cartFooter">

    <div class="total">
      <span>Total</span>
      <span id="total">0 ETB</span>
    </div>

    <button class="checkout" onclick="checkout()">
      💳 Checkout with Chapa
    </button>

  </div>

</div>

<footer>
  <h3>Abdii Market</h3>
  <p style="margin-top:8px;color:#aaa">
    Your fashion marketplace
  </p>
  <p style="margin-top:15px;color:#777">
    © 2026 Abdii Market
  </p>
</footer>

<script>

const products = [];

let id = 1;

/* --------------------------------
   PRODUCT GENERATOR
-------------------------------- */

function addProducts(category, count, gender, emoji, basePrice, colors){

  for(let i=1;i<=count;i++){

    const color = colors[(i-1)%colors.length];

    products.push({

      id:id++,

      name:
        category.charAt(0).toUpperCase()
        + category.slice(1)
        + " Fashion "
        + i,

      category:category,

      gender:gender,

      color:color,

      price:basePrice + ((i%7)*500),

      emoji:emoji

    });

  }

}

/* 80 CLOTHES */

const clothesColors=[
  "Black","White","Red","Blue",
  "Green","Yellow","Pink","Purple",
  "Brown","Black"
];

for(let i=1;i<=80;i++){

  const gender = i%2===0 ? "female":"male";

  products.push({

    id:id++,

    name:
      (gender==="male" ? "Men's" : "Women's")
      +" Fashion Dress "
      +i,

    category:"clothes",

    gender:gender,

    color:clothesColors[(i-1)%clothesColors.length],

    price:3000+((i%15)*500),

    emoji:"👕"

  });

}

/* SHOES 20 */

addProducts(
  "shoes",
  10,
  "male",
  "👟",
  4500,
  ["Black","White","Blue","Red","Brown"]
);

addProducts(
  "shoes",
  10,
  "female",
  "👠",
  4500,
  ["Black","White","Pink","Red","Purple"]
);

/* PANTS 20 */

addProducts(
  "pants",
  10,
  "male",
  "👖",
  5000,
  ["Black","Blue","Brown","White","Green"]
);

addProducts(
  "pants",
  10,
  "female",
  "👖",
  5000,
  ["Black","Blue","Pink","White","Purple"]
);

/* GLASSES 20 */

addProducts(
  "glasses",
  10,
  "male",
  "🕶️",
  2500,
  ["Black","Brown","Blue","Silver","Gold"]
);

addProducts(
  "glasses",
  10,
  "female",
  "🕶️",
  2500,
  ["Black","Pink","Purple","Gold","Silver"]
);

/* WATCH 20 */

addProducts(
  "watch",
  10,
  "male",
  "⌚",
  7000,
  ["Black","Silver","Gold","Blue","Brown"]
);

addProducts(
  "watch",
  10,
  "female",
  "⌚",
  7000,
  ["Gold","Silver","Pink","Black","Purple"]
);

/* NECKLACE 10 */

addProducts(
  "necklace",
  10,
  "male",
  "📿",
  6000,
  ["Gold","Silver","Black","Gold","Silver"]
);

/* BAG 10 */

addProducts(
  "bag",
  10,
  "female",
  "👜",
  4500,
  ["Black","Brown","Red","Pink","Purple"]
);

let cart =
  JSON.parse(localStorage.getItem("abdiiCart")) || [];


/* --------------------------------
   RENDER PRODUCTS
-------------------------------- */

function renderProducts(){

  const container =
    document.getElementById("products");

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const category =
    document.getElementById("category").value;

  const gender =
    document.getElementById("gender").value;

  const color =
    document.getElementById("color").value;

  const sort =
    document.getElementById("sort").value;

  let list = products.filter(p=>{

    const searchMatch =
      p.name.toLowerCase().includes(search)
      ||
      p.category.toLowerCase().includes(search)
      ||
      p.gender.toLowerCase().includes(search)
      ||
      p.color.toLowerCase().includes(search);

    const categoryMatch =
      category==="all" ||
      p.category===category;

    const genderMatch =
      gender==="all" ||
      p.gender===gender;

    const colorMatch =
      color==="all" ||
      p.color===color;

    return
      searchMatch &&
      categoryMatch &&
      genderMatch &&
      colorMatch;

  });

  if(sort==="low"){
    list.sort((a,b)=>a.price-b.price);
  }

  if(sort==="high"){
    list.sort((a,b)=>b.price-a.price);
  }

  document.getElementById("count").textContent =
    list.length+" products";

  container.innerHTML="";

  if(list.length===0){

    container.innerHTML=
      `<div class="empty">
        😔 Product hin argamne.
      </div>`;

    return;

  }

  list.forEach(p=>{

    const card=document.createElement("div");

    card.className="card";

    card.innerHTML=`

      <div
        class="productImage"
        onclick="zoomProduct(${p.id})"
      >

        <span class="badge">
          ${p.gender==="male"?"MEN":"WOMEN"}
        </span>

        <div class="emoji">
          ${p.emoji}
        </div>

      </div>

      <div class="cardBody">

        <div class="category">
          ${p.category.toUpperCase()}
        </div>

        <div class="name">
          ${p.name}
        </div>

        <div class="price">
          ${p.price.toLocaleString()} ETB
        </div>

        <div class="meta">
          <span class="tag">${p.gender}</span>
          <span class="tag">${p.color}</span>
        </div>

        <button
          class="addBtn"
          onclick="addToCart(${p.id})"
        >
          🛒 Add to Cart
        </button>

      </div>
    `;

    container.appendChild(card);

  });

}


/* --------------------------------
   CART
-------------------------------- */

function addToCart(id){

  const existing =
    cart.find(item=>item.id===id);

  if(existing){

    existing.qty++;

  }else{

    const product =
      products.find(p=>p.id===id);

    cart.push({

      id:product.id,

      name:product.name,

      price:product.price,

      emoji:product.emoji,

      qty:1

    });

  }

  saveCart();

  updateCart();

  openCart();

}


function saveCart(){

  localStorage.setItem(
    "abdiiCart",
    JSON.stringify(cart)
  );

}


function updateCart(){

  const container =
    document.getElementById("cartItems");

  const count =
    cart.reduce((sum,item)=>sum+item.qty,0);

  document.getElementById("cartCount").textContent =
    count;

  container.innerHTML="";

  let total=0;

  if(cart.length===0){

    container.innerHTML=
      `<div style="text-align:center;padding:50px;color:#777">
        🛒 Cart kee duwwaa dha.
      </div>`;

  }

  cart.forEach(item=>{

    total += item.price * item.qty;

    const div=document.createElement("div");

    div.className="cartItem";

    div.innerHTML=`

      <div class="cartEmoji">
        ${item.emoji}
      </div>

      <div class="cartInfo">

        <strong>${item.name}</strong>

        <div style="font-size:13px;margin-bottom:8px">
          ${item.price.toLocaleString()} ETB
        </div>

        <div class="qty">

          <button
            onclick="changeQty(${item.id},-1)"
          >−</button>

          <span>${item.qty}</span>

          <button
            onclick="changeQty(${item.id},1)"
          >+</button>

          <button
            class="remove"
            onclick="removeFromCart(${item.id})"
          >
            Remove
          </button>

        </div>

      </div>
    `;

    container.appendChild(div);

  });

  document.getElementById("total").textContent =
    total.toLocaleString()+" ETB";

}


function changeQty(id,change){

  const item =
    cart.find(x=>x.id===id);

  if(!item) return;

  item.qty += change;

  if(item.qty<=0){

    cart =
      cart.filter(x=>x.id!==id);

  }

  saveCart();

  updateCart();

}


function removeFromCart(id){

  cart =
    cart.filter(item=>item.id!==id);

  saveCart();

  updateCart();

}


function openCart(){

  document
    .getElementById("cartPanel")
    .classList.add("open");

}


function closeCart(){

  document
    .getElementById("cartPanel")
    .classList.remove("open");

}


/* --------------------------------
   IMAGE ZOOM
-------------------------------- */

function zoomProduct(id){

  const p =
    products.find(x=>x.id===id);

  if(!p) return;

  document.getElementById("zoomEmoji")
    .textContent=p.emoji;

  document.getElementById("zoomName")
    .textContent=p.name;

  document.getElementById("zoomPrice")
    .textContent=
      p.price.toLocaleString()+" ETB";

  document
    .getElementById("imageModal")
    .classList.add("active");

}


function closeImage(){

  document
    .getElementById("imageModal")
    .classList.remove("active");

}


/* --------------------------------
   CHAPA PLACEHOLDER
-------------------------------- */

function checkout(){

  if(cart.length===0){

    alert("Cart kee duwwaa dha.");

    return;

  }

  const total =
    cart.reduce(
      (sum,item)=>
        sum+(item.price*item.qty),
      0
    );

  /*
    CHAPA BACKEND

    Asitti booda endpoint kee galchi:

    fetch("/api/checkout",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        amount:total,
        items:cart
      })
    })

  */

  alert(
    "Checkout ready!\n\n"+
    "Total: "+
    total.toLocaleString()+
    " ETB\n\n"+
    "Chapa backend itti aanu keessatti walitti hidha."
  );

}


/* START */

renderProducts();

updateCart();

</script>

</body>
</html>
