<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdii Market — Real Fashion Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
color:#111
}

header{
position:sticky;
top:0;
z-index:50;
background:#111;
color:#fff;
padding:14px
}

.nav{
max-width:1280px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:25px;
font-weight:900
}

.logo b{
color:#d4af37
}

.cartBtn{
border:0;
border-radius:12px;
background:#d4af37;
padding:11px 16px;
font-weight:800;
cursor:pointer
}

.hero{
min-height:390px;
padding:55px 15px;
display:grid;
place-items:center;
text-align:center;
color:#fff;

background:
linear-gradient(#0008,#0008),
url("https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1800&q=85")
center/cover
}

.hero h1{
font-size:clamp(30px,6vw,58px);
margin-bottom:10px
}

.hero p{
color:#eee;
margin-bottom:22px
}

.search{
display:flex;
max-width:820px;
margin:auto;
background:#fff;
border-radius:16px;
overflow:hidden
}

.search input{
flex:1;
border:0;
outline:0;
padding:17px;
font-size:16px
}

.search button{
border:0;
background:#d4af37;
width:60px;
font-size:21px
}

.filters{
max-width:1280px;
margin:18px auto;
padding:0 15px;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:9px
}

select{
padding:12px;
border:1px solid #ddd;
border-radius:10px;
background:#fff
}

main{
max-width:1280px;
margin:auto;
padding:10px 15px 50px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin:22px 0
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px
}

.card{
background:#fff;
border-radius:17px;
overflow:hidden;
box-shadow:0 3px 15px #0001;
transition:.2s
}

.card:hover{
transform:translateY(-4px)
}

.pic{
height:290px;
position:relative;
background:#eee;
overflow:hidden;
cursor:zoom-in
}

.pic img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.35s
}

.pic:hover img{
transform:scale(1.06)
}

.badge{
position:absolute;
left:9px;
top:9px;
background:#111;
color:#fff;
padding:6px 9px;
border-radius:8px;
font-size:10px;
font-weight:bold;
z-index:2
}

.info{
padding:13px
}

.cat{
font-size:11px;
color:#888;
margin-bottom:5px
}

.name{
font-weight:800;
margin-bottom:7px
}

.price{
font-size:18px;
font-weight:900;
color:#a27800;
margin-bottom:9px
}

.tags{
display:flex;
gap:5px;
flex-wrap:wrap;
margin-bottom:11px
}

.tag{
background:#f1f1f1;
border-radius:6px;
padding:5px 7px;
font-size:10px
}

.add{
width:100%;
border:0;
border-radius:10px;
padding:11px;
background:#111;
color:#fff;
font-weight:800;
cursor:pointer
}

.add:hover{
background:#d4af37;
color:#111
}

/* CART */

.cart{
position:fixed;
z-index:100;
right:-430px;
top:0;
width:420px;
max-width:100%;
height:100%;
background:#fff;
transition:.3s;
box-shadow:-5px 0 25px #0004;
display:flex;
flex-direction:column
}

.cart.open{
right:0
}

.cartHead{
padding:17px;
background:#111;
color:#fff;
display:flex;
justify-content:space-between
}

.close{
background:#333;
color:#fff;
border:0;
border-radius:50%;
width:34px;
height:34px;
font-size:20px
}

.cartList{
flex:1;
overflow:auto;
padding:15px
}

.cartItem{
display:flex;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee
}

.cartImg{
width:70px;
height:70px;
flex-shrink:0;
border-radius:8px;
overflow:hidden;
background:#eee
}

.cartImg img{
width:100%;
height:100%;
object-fit:cover
}

.cartInfo{
flex:1
}

.qty{
display:flex;
align-items:center;
gap:8px;
margin-top:7px
}

.qty button{
width:27px;
height:27px;
border:0;
background:#111;
color:#fff;
border-radius:6px
}

.remove{
border:0;
background:none;
color:red;
margin-left:5px
}

.cartFoot{
padding:17px;
border-top:1px solid #ddd
}

.total{
display:flex;
justify-content:space-between;
font-weight:900;
font-size:20px;
margin-bottom:14px
}

.checkout{
width:100%;
padding:14px;
border:0;
border-radius:11px;
background:#d4af37;
font-weight:900
}

/* ZOOM */

.zoom{
position:fixed;
inset:0;
background:#000d;
z-index:200;
display:none;
align-items:center;
justify-content:center;
padding:15px
}

.zoom.show{
display:flex
}

.zoomBox{
background:#fff;
max-width:850px;
width:100%;
max-height:92vh;
overflow:auto;
padding:15px;
border-radius:18px;
position:relative
}

.zoomBox img{
width:100%;
max-height:72vh;
object-fit:contain;
border-radius:12px
}

.zoomClose{
position:absolute;
right:10px;
top:10px;
width:38px;
height:38px;
border:0;
border-radius:50%;
background:#111;
color:#fff;
font-size:20px;
z-index:2
}

footer{
background:#111;
color:#fff;
text-align:center;
padding:35px
}

@media(max-width:1000px){

.products{
grid-template-columns:repeat(3,1fr)
}

.filters{
grid-template-columns:repeat(3,1fr)
}

}

@media(max-width:650px){

.filters{
grid-template-columns:1fr 1fr
}

.products{
grid-template-columns:repeat(2,1fr);
gap:9px
}

.pic{
height:215px
}

.info{
padding:9px
}

.name{
font-size:13px
}

.price{
font-size:15px
}

.cart{
width:100%
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
Abdii <b>Market</b>
</div>

<button class="cartBtn" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>

</header>


<section class="hero">

<div>

<h1>🔥 Abdii Fashion Market</h1>

<p>
Real fashion photos • Shoes • Kufiya • Watches • Jewelry • Bags
</p>

<div class="search">

<input
id="search"
placeholder="Search Jordan 4, Kufiya, Black, Dhiira, Size 42..."
oninput="render()"
>

<button>🔎</button>

</div>

</div>

</section>


<div class="filters">

<select id="category" onchange="render()">

<option value="all">
🛍️ All Products
</option>

<option value="clothes">
👕 Uffata
</option>

<option value="kufiya">
🧢 Kufiya
</option>

<option value="pants">
👖 Pants
</option>

<option value="glasses">
🕶️ Eye Glass
</option>

<option value="watch">
⌚ Watch
</option>

<option value="necklace">
💎 Necklace
</option>

<option value="bag">
👜 Borsa
</option>

</select>


<select id="gender" onchange="render()">

<option value="all">
👥 Gender Hunda
</option>

<option value="male">
👨 Dhiira
</option>

<option value="female">
👩 Durba
</option>

</select>


<select id="size" onchange="render()">

<option value="all">
📏 Size Hunda
</option>

<option>XS</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>38</option>
<option>39</option>
<option>40</option>
<option>41</option>
<option>42</option>
<option>43</option>
<option>44</option>
<option>45</option>

</select>


<select id="color" onchange="render()">

<option value="all">
🎨 Color Hunda
</option>

<option>Black</option>
<option>White</option>
<option>Red</option>
<option>Blue</option>
<option>Green</option>
<option>Brown</option>
<option>Grey</option>
<option>Pink</option>
<option>Purple</option>
<option>Yellow</option>
<option>Orange</option>
<option>Beige</option>
<option>Cream</option>
<option>Navy</option>
<option>Maroon</option>
<option>Gold</option>
<option>Silver</option>
<option>Khaki</option>
<option>Sky Blue</option>
<option>Dark Green</option>

</select>


<select id="sort" onchange="render()">

<option value="default">
↕️ Sort
</option>

<option value="low">
Gatii xiqqaa → guddaa
</option>

<option value="high">
Gatii guddaa → xiqqaa
</option>

</select>

</div>


<main>

<div class="top">

<h2>
🛍️ Products
</h2>

<span id="count"></span>

</div>

<div
class="products"
id="products">
</div>

</main>


<!-- CART -->

<div class="cart" id="cart">

<div class="cartHead">

<h2>
🛒 Cart
</h2>

<button
class="close"
onclick="closeCart()">
×
</button>

</div>


<div
class="cartList"
id="cartList">
</div>


<div class="cartFoot">

<div class="total">

<span>
Total
</span>

<span id="total">
0 ETB
</span>

</div>

<button
class="checkout"
onclick="checkout()">

💳 Chapa Checkout

</button>

</div>

</div>


<!-- ZOOM -->

<div
class="zoom"
id="zoom"
onclick="closeZoom()">

<div
class="zoomBox"
onclick="event.stopPropagation()">

<button
class="zoomClose"
onclick="closeZoom()">
×
</button>

<div id="zoomImage"></div>

<h2
id="zoomName"
style="margin-top:10px">
</h2>

<p
id="zoomPrice"
style="color:#a27800;font-weight:bold;margin-top:6px">
</p>

</div>

</div>


<footer>

<h3>
Abdii Market
</h3>

<p style="color:#aaa;margin-top:8px">
Your Fashion Marketplace
</p>

<p style="color:#777;margin-top:15px">
© 2026 Abdii Market
</p>

</footer>


<script>

const images={

clothes:[
"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=800&q=85"
],

kufiya:[
"https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1575428652377-a2d80e2277fc?auto=format&fit=crop&w=800&q=85"
],

pants:[
"https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1473966968600-fa801b869a1a?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1506629905607-d9a7a2c4e6f0?auto=format&fit=crop&w=800&q=85"
],

glasses:[
"https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1577803645773-f96470509666?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1508296695146-257a814070b4?auto=format&fit=crop&w=800&q=85"
],

watch:[
"https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=800&q=85"
],

necklace:[
"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=800&q=85"
],

bag:[
"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=800&q=85",
"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=85"
]

};


const colors=[
"Black","White","Red","Blue","Green",
"Brown","Grey","Pink","Purple","Yellow",
"Orange","Beige","Cream","Navy","Maroon",
"Gold","Silver","Khaki","Sky Blue","Dark Green"
];


const sizes=[
"XS","S","M","L","XL","XXL",
"38","39","40","41","42","43","44","45"
];


const products=[];

let ID=1;


function add(
name,
category,
gender,
color,
size,
price
){

products.push({

id:ID++,
name,
category,
gender,
color,
size,
price,

image:
images[category]
[(ID-2)%images[category].length]

});

}


/* 80 UFFATA */

for(let i=1;i<=80;i++){

let g=i<=40?"male":"female";

add(

i===1
?"Jordan 4 Inspired Fashion Shirt"
:
g==="male"
?`Men Fashion Shirt ${i}`
:`Women Fashion Dress ${i-40}`,

"clothes",

g,

colors[(i-1)%20],

sizes[(i-1)%sizes.length],

850+(i%14)*100

);

}


/* 20 KUFIYA */

for(let i=1;i<=20;i++){

let g=i<=10?"male":"female";

add(

`Kufiya Fashion ${i}`,

"kufiya",

g,

colors[(i+5)%20],

"Free",

800+(i%8)*150

);

}


/* 20 PANTS */

for(let i=1;i<=20;i++){

let g=i<=10?"male":"female";

add(

`${g==="male"?"Men":"Women"} Pant ${i<=10?i:i-10}`,

"pants",

g,

colors[(i+3)%20],

sizes[(i+2)%sizes.length],

950+(i%8)*200

);

}


/* 20 EYEGLASS */

for(let i=1;i<=20;i++){

let g=i<=10?"male":"female";

add(

`${g==="male"?"Men":"Women"} Eyeglass ${i<=10?i:i-10}`,

"glasses",

g,

["Black","Brown","Gold","Silver","Grey"][(i-1)%5],

"Free",

700+(i%7)*150

);

}


/* 20 WATCH */

for(let i=1;i<=20;i++){

let g=i<=10?"male":"female";

add(

`${g==="male"?"Men":"Women"} Watch ${i<=10?i:i-10}`,

"watch",

g,

colors[(i+8)%20],

"Free",

1500+(i%8)*300

);

}


/* 10 NECKLACE */

for(let i=1;i<=10;i++){

let g=i<=5?"male":"female";

add(

`${g==="male"?"Men":"Women"} Necklace ${i<=5?i:i-5}`,

"necklace",

g,

i%2?"Gold":"Silver",

"Free",

1800+(i%5)*500

);

}


/* 10 BAG */

for(let i=1;i<=10;i++){

let g=i<=5?"male":"female";

add(

`${g==="male"?"Men":"Women"} Bag ${i<=5?i:i-5}`,

"bag",

g,

colors[(i+11)%20],

"Free",

1200+(i%7)*300

);

}


let cart=
JSON.parse(
localStorage.getItem("abdiiMarketCart")
||"[]"
);


/* SEARCH + FILTER */

function render(){

let q=
document
.getElementById("search")
.value
.toLowerCase()
.trim();

let c=
document
.getElementById("category")
.value;

let g=
document
.getElementById("gender")
.value;

let s=
document
.getElementById("size")
.value;

let col=
document
.getElementById("color")
.value;

let sort=
document
.getElementById("sort")
.value;


let list=
products.filter(p=>{

let t=[
p.name,
p.category,
p.gender,
p.gender==="male"
?"dhiira"
:"durba",
p.color,
p.size
]
.join(" ")
.toLowerCase();


return(

(!q||t.includes(q))

&&

(c==="all"||p.category===c)

&&

(g==="all"||p.gender===g)

&&

(s==="all"||p.size===s)

&&

(col==="all"||p.color===col)

);

});


if(sort==="low")
list.sort((a,b)=>a.price-b.price);

if(sort==="high")
list.sort((a,b)=>b.price-a.price);


document
.getElementById("count")
.textContent=
list.length+" products";


let box=
document.getElementById("products");

box.innerHTML="";


if(!list.length){

box.innerHTML=`

<div style="
grid-column:1/-1;
text-align:center;
padding:70px;
color:#777">

😔 Product hin argamne.

</div>

`;

return;

}


list.forEach(p=>{

let card=
document.createElement("div");

card.className="card";


card.innerHTML=`

<div
class="pic"
onclick="zoomProduct(${p.id})">

<div class="badge">

${p.gender==="male"
?"👨 DHIIRA"
:"👩 DURBA"}

</div>

<img
src="${p.image}"
alt="${p.name}"
loading="lazy">

</div>


<div class="info">

<div class="cat">
${p.category.toUpperCase()}
</div>

<div class="name">
${p.name}
</div>

<div class="price">
${p.price.toLocaleString()} ETB
</div>


<div class="tags">

<span class="tag">
🎨 ${p.color}
</span>

<span class="tag">
📏 ${p.size}
</span>

<span class="tag">
${p.gender==="male"
?"👨 Dhiira"
:"👩 Durba"}
</span>

</div>


<button
class="add"
onclick="addCart(${p.id})">

🛒 Add to Cart

</button>

</div>

`;


box.appendChild(card);

});

}


/* CART */

function addCart(id){

let p=
products.find(x=>x.id===id);

let old=
cart.find(x=>x.id===id);


if(old)
old.qty++;

else

cart.push({

id:p.id,
name:p.name,
price:p.price,
qty:1

});


save();

updateCart();

openCart();

}


function save(){

localStorage.setItem(
"abdiiMarketCart",
JSON.stringify(cart)
);

}


function updateCart(){

let box=
document.getElementById("cartList");

box.innerHTML="";


let total=0;
let count=0;


cart.forEach(i=>{

total+=i.price*i.qty;
count+=i.qty;


let p=
products.find(
x=>x.id===i.id
);


let d=
document.createElement("div");

d.className="cartItem";


d.innerHTML=`

<div class="cartImg">

<img
src="${p.image}">

</div>


<div class="cartInfo">

<strong>
${i.name}
</strong>

<div>
${i.price.toLocaleString()} ETB
</div>


<div class="qty">

<button
onclick="changeQty(${i.id},-1)">
−
</button>

<span>
${i.qty}
</span>

<button
onclick="changeQty(${i.id},1)">
+
</button>

<button
class="remove"
onclick="removeItem(${i.id})">

Remove

</button>

</div>

</div>

`;


box.appendChild(d);

});


if(!cart.length){

box.innerHTML=`

<div style="
text-align:center;
padding:60px;
color:#777">

🛒 Cart kee duwwaa dha.

</div>

`;

}


document
.getElementById("cartCount")
.textContent=count;


document
.getElementById("total")
.textContent=
total.toLocaleString()+" ETB";

}


function changeQty(id,n){

let i=
cart.find(x=>x.id===id);

if(!i)return;

i.qty+=n;


if(i.qty<=0){

cart=
cart.filter(
x=>x.id!==id
);

}


save();

updateCart();

}


function removeItem(id){

cart=
cart.filter(
x=>x.id!==id
);

save();

updateCart();

}


/* CART OPEN */

function openCart(){

document
.getElementById("cart")
.classList.add("open");

}


function closeCart(){

document
.getElementById("cart")
.classList.remove("open");

}


/* ZOOM */

function zoomProduct(id){

let p=
products.find(
x=>x.id===id
);


document
.getElementById("zoomImage")
.innerHTML=

`<img src="${p.image}">`;


document
.getElementById("zoomName")
.textContent=
p.name;


document
.getElementById("zoomPrice")
.textContent=
p.price.toLocaleString()
+" ETB";


document
.getElementById("zoom")
.classList.add("show");

}


function closeZoom(){

document
.getElementById("zoom")
.classList.remove("show");

}


/* CHAPA */

function checkout(){

if(!cart.length){

alert(
"Cart kee duwwaa dha."
);

return;

}


let t=
cart.reduce(
(s,i)=>
s+i.price*i.qty,
0
