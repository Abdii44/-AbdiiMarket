<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdii Market</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
  padding:14px;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.cart-btn{
  border:0;
  background:#ffb000;
  color:#111;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111,#333);
  color:white;
  padding:40px 15px;
  text-align:center;
}

.hero h1{
  font-size:35px;
  margin-bottom:10px;
}

.hero p{
  opacity:.9;
}

.search-box{
  max-width:700px;
  margin:20px auto;
  display:flex;
  gap:8px;
}

.search-box input{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  font-size:16px;
}

.categories{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.categories button{
  border:0;
  background:white;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.categories button.active{
  background:#111;
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:15px;
}

.product{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.product img{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:12px;
}

.product h3{
  font-size:16px;
  margin-bottom:7px;
}

.price{
  color:#e69500;
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.add{
  width:100%;
  border:0;
  background:#111;
  color:white;
  padding:11px;
  border-radius:9px;
  cursor:pointer;
}

.add:hover{
  background:#333;
}

.empty{
  text-align:center;
  padding:40px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eee;
  padding:10px 0;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
}

.cart-details{
  flex:1;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:5px;
}

.qty button{
  border:0;
  background:#111;
  color:white;
  width:28px;
  height:28px;
  border-radius:6px;
  cursor:pointer;
}

.remove{
  color:red;
  border:0;
  background:none;
  cursor:pointer;
}

.total{
  font-size:20px;
  font-weight:bold;
  margin:20px 0;
}

.checkout{
  width:100%;
  padding:14px;
  border:0;
  background:#ffb000;
  color:#111;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.form{
  margin-top:15px;
}

.form input{
  width:100%;
  padding:13px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:8px;
}

.telegram{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#229ed9;
  color:white;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:25px;
  z-index:1500;
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:25px 15px;
  margin-top:40px;
}

@media(max-width:500px){
  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product img{
    height:160px;
  }

  .hero h1{
    font-size:28px;
  }
}
</style>
</head>

  <div class="nav">
    <div class="logo">🛒 Abdii Market</div>

    <button class="cart-btn" onclick="openCart()">

    </button>
  </div>
</header>

<section class="hero">

  <p>Meeshaalee barbaadde salphaatti bitadhu</p>

  <div class="search-box">
    <input

</section>

  <button onclick="setCategory('Accessories',this)">⌚ Accessories</button>

</div>

<main class="container">
  <div id="products" class="products"></div>
</main>

<!-- CART -->
<div id="cartModal" class="modal">

    <div class="modal-head">

    </div>

    <div id="cartItems"></div>

    <div class="total">

    <div class="form">

    </div>

    <button class="checkout" onclick="checkout()">
      💳 Chapa irratti kaffali

  </div>
</div>

<a
  class="telegram"
  href="https://t.me/AbdiiMarketBot"
  target="_blank"
  rel="noopener noreferrer"
>
  ✈️
</a>

<footer>
  <h3>🛒 Abdii Market</h3>
  <p>Online Marketplace</p>
  <p>© 2026 Abdii Market</p>

/* =========================
   STATE
========================= */

let cart =
JSON.parse(
  localStorage.getItem("abdiiMarketCart") || "[]"
);

let currentCategory = "All";

/* =========================
   SAVE CART
========================= */

function saveCart(){

  localStorage.setItem(
    "abdiiMarketCart",
    JSON.stringify(cart)
  );

}

/* =========================
   IMAGE
========================= */

function getImage(product){

  return imageBase + product.image;

}

/* =========================
   FORMAT PRICE
========================= */

function formatPrice(price){

  return Number(price).toLocaleString("en-US");

}

/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

  const container =
    document.getElementById("products");

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    products.filter(product => {

      const categoryOK =
        currentCategory === "All" ||
        product.category === currentCategory;

      const searchOK =
        product.name
          .toLowerCase()
          .includes(search);

      return categoryOK && searchOK;

    });

  if(filtered.length === 0){

    container.innerHTML =
      `
      <div class="empty">
        <h3>Meeshaan hin argamne</h3>
        <p>Search kee jijjiiri.</p>
      </div>
      `;

    return;

  }

  container.innerHTML =
    filtered.map(product => `

      <div class="product">

        <img
          src="${getImage(product)}"
          alt="${product.name}"
          loading="lazy"
          onerror="this.src='https://via.placeholder.com/400x400?text=Abdii+Market'"
        >

        <div class="product-info">

          <h3>${product.name}</h3>

          <div class="price">
            ${formatPrice(product.price)} ETB
          </div>

          <button
            class="add"
            onclick="addToCart(${product.id})"
          >
            🛒 Cart keessa galchi
          </button>

        </div>

      </div>

    `).join("");

}

/* =========================
   CATEGORY
========================= */

function setCategory(category, button){

  currentCategory = category;

  document
    .querySelectorAll(".categories button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  renderProducts();

}

/* =========================
   ADD CART
========================= */

function addToCart(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  const existing =
    cart.find(item => item.id === id);

  if(existing){

    existing.qty += 1;

  }else{

    cart.push({
      id:product.id,
      qty:1
    });

  }

  saveCart();
  updateCartCount();

  alert(
    product.name +
    " Cart keessa gale!"
  );

}

/* =========================
   CART COUNT
========================= */

function updateCartCount(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );

  document.getElementById(
    "cartCount"
  ).textContent = count;

}

/* =========================
   OPEN CART
========================= */

function openCart(){

  renderCart();

  document
    .getElementById("cartModal")
    .classList.add("show");

}

/* =========================
   CLOSE CART
========================= */

function closeCart(){

  document
    .getElementById("cartModal")
    .classList.remove("show");

}

/* =========================
   RENDER CART
========================= */

function renderCart(){

  const container =
    document.getElementById("cartItems");

  if(cart.length === 0){

    container.innerHTML =
      `
      <div class="empty">
        <h3>Cart kee duwwaa dha</h3>
        <p>Meeshaa barbaadde cart keessa galchi.</p>
      </div>
      `;

    document.getElementById(
      "cartTotal"
    ).textContent = "0";

    return;

  }

  let total = 0;

  container.innerHTML =
    cart.map(item => {

      const product =
        products.find(
          p => p.id === item.id
        );

      if(!product) return "";

      const subtotal =
        product.price * item.qty;

      total += subtotal;

      return `

        <div class="cart-item">

          <img
            src="${getImage(product)}"
            alt="${product.name}"
            onerror="this.src='https://via.placeholder.com/100?text=Product'"
          >

          <div class="cart-details">

            <strong>
              ${product.name}
            </strong>

            <div>
              ${formatPrice(product.price)} ETB
            </div>

            <div class="qty">

              <button
                onclick="changeQty(${product.id},-1)"
              >
                −
              </button>

              <span>${item.qty}</span>

              <button
                onclick="changeQty(${product.id},1)"
              >
                +
              </button>

            </div>

          </div>

          <button
            class="remove"
            onclick="removeFromCart(${product.id})"
          >
            Haqi
          </button>

        </div>

      `;

    }).join("");

  document.getElementById(
    "cartTotal"
  ).textContent =
    formatPrice(total);

}

/* =========================
   CHANGE QUANTITY
========================= */

function changeQty(id, amount){

  const item =
    cart.find(
      item => item.id === id
    );

  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){

    cart =
      cart.filter(
        item => item.id !== id
      );

  }

  saveCart();
  updateCartCount();
  renderCart();

}

/* =========================
   REMOVE
========================= */

function removeFromCart(id){

  cart =
    cart.filter(
      item => item.id !== id
    );

  saveCart();
  updateCartCount();
  renderCart();

}

/* =========================
   CHECKOUT
========================= */

  if(cart.length === 0){

    alert(
      "Mee yaa cart kee duwwaa dha."

    return;

  const name =

  const phone =

      .trim();

  const address =

      .value
      .trim();

  if(!name || !phone || !address){

    alert(
      "Maqaa, bilbila fi teessoo guuti."
    );

    return;

  }

  let total = 0;

  const items =
    cart.map(item => {

      const product =
        products.find(
          p => p.id === item.id
        );

      if(!product) return null;

      const subtotal =
        product.price * item.qty;

      total += subtotal;

      return {
        productId:product.id,
        name:product.name,
        price:product.price,
        quantity:item.qty,
        subtotal:subtotal
      };

    }).filter(Boolean);

  const order = {

    customer:{
      name:name,
      phone:phone,
      address:address
    },

    items:items,

    total:total,

    currency:"ETB",

    createdAt:
      new Date().toISOString()

  };

  /*
   IMPORTANT:
   Chapa Secret Key frontend keessa
   hin kaa'in.

   Backend endpoint kee asitti kaa'i.
  */

  const API_URL =
    "/api/chapa/initialize";

  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(order)
        }
      );

    const data =
      await response.json();

    if(
      data &&
      data.checkout_url
    ){

      window.location.href =
        data.checkout_url;

      return;

    }

    if(
      data &&
      data.data &&
      data.data.checkout_url
    ){

      window.location.href =
        data.data.checkout_url;

      return;

    }

    alert(
      "Chapa checkout URL hin argamne."
    );

  }catch(error){

    console.error(error);

    const message =
      `🛒 ABDII MARKET ORDER%0A%0A` +

      `👤 Maqaa: ${encodeURIComponent(name)}%0A` +

      `📞 Bilbila: ${encodeURIComponent(phone)}%0A` +

      `📍 Teessoo: ${encodeURIComponent(address)}%0A%0A` +

      items.map(item =>
        `• ${encodeURIComponent(item.name)} x${item.quantity} = ${formatPrice(item.subtotal)} ETB`
      ).join("%0A") +

      `%0A%0A💰 Total: ${formatPrice(total)} ETB`;

    alert(
      "Chapa backend waliin wal qunnamuun dadhabe. Telegram irratti order ergi."
    );

    window.open(
      "https://t.me/AbdiiMarketBot",
      "_blank"
    );

  }

}

   CLOSE MODAL OUTSIDE
========================= */

document
  .getElementById("cartModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){

        closeCart();

      }

    }
  );

/* =========================
   START
========================= */

renderProducts();
updateCartCount();

</script>
