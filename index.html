<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdii Market</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f4;
  color:#111;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#111;
  color:white;
  padding:14px;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.cart-btn{
  border:0;
  background:#ffb000;
  color:#111;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  padding:45px 15px;
  text-align:center;
  color:white;
  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.88),
      rgba(40,40,40,.75)
    ),
    radial-gradient(circle at top,#555,#111);
}

.hero h1{
  font-size:36px;
  margin-bottom:10px;
}

.hero p{
  opacity:.9;
  font-size:16px;
}

.search-box{
  max-width:700px;
  margin:22px auto 0;
}

.search-box input{
  width:100%;
  padding:15px;
  border:0;
  outline:none;
  border-radius:12px;
  font-size:16px;
}

.categories{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.categories button{
  border:0;
  background:white;
  padding:11px 17px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.categories button.active{
  background:#111;
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:16px;
}

.product{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 14px rgba(0,0,0,.09);
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
}

.product-image{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
  background:#eee;
  cursor:zoom-in;
}

.product-info{
  padding:13px;
}

.product h3{
  font-size:17px;
  margin-bottom:8px;
}

.price{
  color:#df8c00;
  font-size:18px;
  font-weight:bold;
  margin-bottom:11px;
}

.add{
  width:100%;
  border:0;
  background:#111;
  color:white;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.add:hover{
  background:#333;
}

.empty{
  text-align:center;
  padding:45px;
  color:#777;
}

/* IMAGE VIEWER */

.image-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.9);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.image-modal.show{
  display:flex;
}

.image-modal img{
  max-width:95%;
  max-height:88vh;
  object-fit:contain;
  border-radius:12px;
}

.image-close{
  position:absolute;
  top:18px;
  right:18px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:white;
  color:#111;
  font-size:24px;
  cursor:pointer;
}

/* CART */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  border-radius:16px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  border:0;
  background:#eee;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:9px;
}

.cart-details{
  flex:1;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.qty button{
  border:0;
  background:#111;
  color:white;
  width:29px;
  height:29px;
  border-radius:6px;
  cursor:pointer;
}

.remove{
  border:0;
  background:none;
  color:red;
  cursor:pointer;
}

.total{
  font-size:21px;
  font-weight:bold;
  margin:20px 0;
}

.form input{
  width:100%;
  padding:13px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
}

.checkout{
  width:100%;
  padding:14px;
  border:0;
  background:#ffb000;
  color:#111;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

.telegram{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:1500;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#229ed9;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:26px;
  box-shadow:0 4px 15px rgba(0,0,0,.25);
}

footer{
  margin-top:45px;
  padding:28px 15px;
  text-align:center;
  background:#111;
  color:white;
}

@media(max-width:500px){

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-image{
    height:170px;
  }

  .product-info{
    padding:10px;
  }

  .product h3{
    font-size:14px;
  }

  .price{
    font-size:16px;
  }

  .hero h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">🛒 Abdii Market</div>

    <button class="cart-btn" onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</header>

<section class="hero">

  <h1>🛍️ Abdii Market</h1>

  <p>
    Meeshaalee barbaadde salphaatti bitadhu
  </p>

  <div class="search-box">

    <input
      id="search"
      type="text"
      placeholder="🔎 Maqaa meeshaa barbaadi..."
      oninput="renderProducts()"
    >

  </div>

</section>

<div class="categories">

  <button
    class="active"
    onclick="setCategory('All',this)"
  >
    Hunda
  </button>

  <button onclick="setCategory('Shoes',this)">
    👟 Shoes
  </button>

  <button onclick="setCategory('Clothes',this)">
    👕 Clothes
  </button>

  <button onclick="setCategory('Electronics',this)">
    📱 Electronics
  </button>

</div>

<main class="container">

  <div
    id="products"
    class="products"
  ></div>

</main>


<!-- IMAGE FULLSCREEN -->

<div
  id="imageModal"
  class="image-modal"
  onclick="closeImage(event)"
>

  <button
    class="image-close"
    onclick="closeImage()"
  >
    ✕
  </button>

  <img
    id="largeImage"
    src=""
    alt="Product"
  >

</div>


<!-- CART -->

<div
  id="cartModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>🛒 Cart Kee</h2>

      <button
        class="close"
        onclick="closeCart()"
      >
        ✕
      </button>

    </div>

    <div id="cartItems"></div>

    <div class="total">

      Total:
      <span id="cartTotal">0</span>
      ETB

    </div>

    <div class="form">

      <input
        id="customerName"
        placeholder="Maqaa kee"
      >

      <input
        id="customerPhone"
        placeholder="Lakkoofsa bilbilaa"
      >

      <input
        id="customerAddress"
        placeholder="Teessoo / bakka geejjibaa"
      >

    </div>

    <button
      class="checkout"
      onclick="checkout()"
    >
      💳 Chapa irratti kaffali
    </button>

  </div>

</div>


<a
  class="telegram"
  href="https://t.me/AbdiiMarketBot"
  target="_blank"
>
  ✈️
</a>


<footer>

  <h3>🛒 Abdii Market</h3>

  <p>Online Marketplace</p>

  <p>© 2026 Abdii Market</p>

</footer>


<script>

/* =========================
   IMAGE BASE
========================= */

const imageBase =
"https://raw.githubusercontent.com/Abdii44/-AbdiiMarket/main/";


/* =========================
   PRODUCTS 10
========================= */

const products = [

  {
    id:1,
    name:"Jordan 4",
    price:5500,
    category:"Shoes",
    image:"IMG_8978.jpeg"
  },

  {
    id:2,
    name:"Jordan 7",
    price:8600,
    category:"Shoes",
    image:"IMG_8984.jpeg"
  },

  {
    id:3,
    name:"T-Shirt",
    price:3000,
    category:"Clothes",
    image:"IMG_8989.jpeg"
  },

  {
    id:4,
    name:"Jeans",
    price:4500,
    category:"Clothes",
    image:"IMG_8993.jpeg"
  },

  {
    id:5,
    name:"Tuta",
    price:3999,
    category:"Clothes",
    image:"IMG_9032.jpeg"
  },

  {
    id:6,
    name:"iPhone 17 Pro Max",
    price:299999,
    category:"Electronics",
    image:"IMG_9033.jpeg"
  },

  {
    id:7,
    name:"Mayik",
    price:8999,
    category:"Clothes",
    image:"IMG_9034.jpeg"
  },

  {
    id:8,
    name:"Earphone",
    price:2000,
    category:"Electronics",
    image:"IMG_9035.jpeg"
  },

  {
    id:9,
    name:"Power Bank",
    price:4999,
    category:"Electronics",
    image:"IMG_9036.jpeg"
  },

  {
    id:10,
    name:"Mulu Sure Shoes",
    price:12000,
    category:"Shoes",
    image:"IMG_9037.jpeg"
  }

];


/* =========================
   STATE
========================= */

let cart =
  JSON.parse(
    localStorage.getItem(
      "abdiiMarketCart"
    ) || "[]"
  );

let currentCategory = "All";


/* =========================
   SAVE CART
========================= */

function saveCart(){

  localStorage.setItem(
    "abdiiMarketCart",
    JSON.stringify(cart)
  );

}


/* =========================
   IMAGE URL
========================= */

function getImage(product){

  return imageBase + product.image;

}


/* =========================
   PRICE FORMAT
========================= */

function formatPrice(price){

  return Number(price)
    .toLocaleString("en-US");

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

  const container =
    document.getElementById(
      "products"
    );

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    products.filter(product => {

      const categoryOK =
        currentCategory === "All" ||
        product.category ===
        currentCategory;

      const searchOK =
        product.name
          .toLowerCase()
          .includes(search);

      return (
        categoryOK &&
        searchOK
      );

    });


  if(filtered.length === 0){

    container.innerHTML = `

      <div class="empty">

        <h3>
          Meeshaan hin argamne
        </h3>

        <p>
          Search kee jijjiiri.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered.map(product => `

      <div class="product">

        <img
          class="product-image"
          src="${getImage(product)}"
          alt="${product.name}"
          loading="lazy"
          onclick="openImage('${getImage(product)}')"
          onerror="
            this.src='https://via.placeholder.com/500x500?text=Abdii+Market'
          "
        >

        <div class="product-info">

          <h3>
            ${product.name}
          </h3>

          <div class="price">
            ${formatPrice(product.price)}
            ETB
          </div>

          <button
            class="add"
            onclick="addToCart(${product.id})"
          >
            🛒 Cart keessa galchi
          </button>

        </div>

      </div>

    `).join("");

}


/* =========================
   IMAGE VIEW
========================= */

function openImage(src){

  document.getElementById(
    "largeImage"
  ).src = src;

  document.getElementById(
    "imageModal"
  ).classList.add("show");

}


function closeImage(event){

  if(
    !event ||
    event.target.id ===
    "imageModal"
  ){

    document.getElementById(
      "imageModal"
    ).classList.remove("show");

  }

}


/* =========================
   CATEGORY
========================= */

function setCategory(
  category,
  button
){

  currentCategory =
    category;

  document
    .querySelectorAll(
      ".categories button"
    )
    .forEach(btn =>
      btn.classList.remove(
        "active"
      )
    );

  button.classList.add(
    "active"
  );

  renderProducts();

}


/* =========================
   ADD CART
========================= */

function addToCart(id){

  const product =
    products.find(
      p => p.id === id
    );

  if(!product) return;


  const existing =
    cart.find(
      item => item.id === id
    );


  if(existing){

    existing.qty += 1;

  }else{

    cart.push({

      id:product.id,

      qty:1

    });

  }


  saveCart();

  updateCartCount();

  alert(
    product.name +
    " Cart keessa gale! 🛒"
  );

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );

  document.getElementById(
    "cartCount"
  ).textContent = count;

}


/* =========================
   OPEN CART
========================= */

function openCart(){

  renderCart();

  document
    .getElementById(
      "cartModal"
    )
    .classList.add(
      "show"
    );

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

  document
    .getElementById(
      "cartModal"
    )
    .classList.remove(
      "show"
    );

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const container =
    document.getElementById(
      "cartItems"
    );


  if(cart.length === 0){

    container.innerHTML = `

      <div class="empty">

        <h3>
          Cart kee duwwaa dha
        </h3>

        <p>
          Meeshaa barbaadde
          cart keessa galchi.
        </p>

      </div>

    `;

    document.getElementById(
      "cartTotal"
    ).textContent = "0";

    return;

  }


  let total = 0;


  container.innerHTML =
    cart.map(item => {

      const product =
        products.find(
          p => p.id === item.id
        );


      if(!product)
        return "";


      const subtotal =
        product.price *
        item.qty;


      total += subtotal;


      return `

        <div class="cart-item">

          <img
            src="${getImage(product)}"
            alt="${product.name}"
          >

          <div class="cart-details">

            <strong>
              ${product.name}
            </strong>

            <div>
              ${formatPrice(product.price)}
              ETB
            </div>

            <div class="qty">

              <button
                onclick="
                  changeQty(
                    ${product.id},
                    -1
                  )
                "
              >
                −
              </button>

              <span>
                ${item.qty}
              </span>

              <button
                onclick="
                  changeQty(
                    ${product.id},
                    1
                  )
                "
              >
                +
              </button>

            </div>

          </div>

          <button
            class="remove"
            onclick="
              removeFromCart(
                ${product.id}
              )
            "
          >
            Haqi
          </button>

        </div>

      `;

    }).join("");


  document.getElementById(
    "cartTotal"
  ).textContent =
    formatPrice(total);

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQty(
  id,
  amount
){

  const item =
    cart.find(
      item => item.id === id
    );

  if(!item) return;


  item.qty += amount;


  if(item.qty <= 0){

    cart =
      cart.filter(
        item =>
          item.id !== id
      );

  }


  saveCart();

  updateCartCount();

  renderCart();

}


/* =========================
   REMOVE
========================= */

function removeFromCart(id){

  cart =
    cart.filter(
      item =>
        item.id !== id
    );

  saveCart();

  updateCartCount();

  renderCart();

}


/* =========================
   CHECKOUT
========================= */

async function checkout(){

  if(cart.length === 0){

    alert(
      "Mee yaa cart kee duwwaa dha."
    );

    return;

  }


  const name =
    document
      .getElementById(
        "customerName"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "customerPhone"
      )
      .value
      .trim();


  const address =
    document
      .getElementById(
        "customerAddress"
      )
      .value
      .trim();


  if(
    !name ||
    !phone ||
    !address
  ){

    alert(
      "Maqaa, bilbila fi teessoo guuti."
    );

    return;

  }


  let total = 0;


  const items =
    cart.map(item => {

      const product =
        products.find(
          p => p.id === item.id
        );


      const subtotal =
        product.price *
        item.qty;


      total += subtotal;


      return {

        productId:
          product.id,

        name:
          product.name,

        price:
          product.price,

        quantity:
          item.qty,

        subtotal:
          subtotal

      };

    });


  const order = {

    customer:{

      name:name,

      phone:phone,

      address:address

    },

    items:items,

    total:total,

    currency:"ETB",

    createdAt:
      new Date()
      .toISOString()

  };


  /*
    Chapa Secret Key
    FRONTEND keessa hin kaa'in.

    Backend endpoint kee:
    /api/chapa/initialize
  */


  const API_URL =
    "/api/chapa/initialize";


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              order
            )

        }
      );


    const data =
      await response.json();


    if(
      data &&
      data.checkout_url
    ){

      window.location.href =
        data.checkout_url;

      return;

    }


    if(
      data &&
      data.data &&
      data.data.checkout_url
    ){

      window.location.href =
        data.data.checkout_url;

      return;

    }


    alert(
      "Chapa checkout URL hin argamne."
    );


  }catch(error){

    console.error(error);

    alert(
      "Chapa backend hin argamne. Mee backend kee ilaali."
    );

  }

}


/* =========================
   CLOSE CART OUTSIDE
========================= */

document
  .getElementById(
    "cartModal"
  )
  .addEventListener(
    "click",
    function(e){

      if(
        e.target === this
      ){

        closeCart();

      }

    }
  );


/* =========================
   START
========================= */

renderProducts();

updateCartCount();

</script>

</body>
</html>
