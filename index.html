<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdii Market | Fashion Marketplace</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
color:#111;
}

header{
position:sticky;
top:0;
z-index:100;
background:#111;
color:#fff;
padding:14px;
box-shadow:0 2px 15px #0003;
}

.nav{
max-width:1250px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.logo{
font-size:24px;
font-weight:900;
}

.logo span{
color:#d4af37;
}

.cartBtn{
background:#d4af37;
border:0;
padding:11px 16px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.hero{
background:
linear-gradient(#0009,#0009),
linear-gradient(135deg,#050505,#333);
color:#fff;
text-align:center;
padding:55px 15px;
}

.hero h1{
font-size:40px;
margin-bottom:10px;
}

.hero p{
color:#ddd;
margin-bottom:22px;
}

.search{
max-width:800px;
margin:auto;
background:#fff;
border-radius:15px;
display:flex;
overflow:hidden;
}

.search input{
flex:1;
border:0;
outline:0;
padding:16px;
font-size:16px;
}

.search button{
width:60px;
border:0;
background:#d4af37;
font-size:21px;
cursor:pointer;
}

.filters{
max-width:1250px;
margin:18px auto;
padding:0 15px;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:9px;
}

select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
background:#fff;
outline:none;
}

.container{
max-width:1250px;
margin:auto;
padding:10px 15px 50px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 0;
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
}

.card{
background:#fff;
border-radius:17px;
overflow:hidden;
box-shadow:0 3px 15px #00000012;
transition:.25s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 8px 25px #0002;
}

.pic{
height:280px;
background:#eee;
position:relative;
overflow:hidden;
cursor:zoom-in;
}

.pic img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.35s;
}

.pic:hover img{
transform:scale(1.08);
}

.badge{
position:absolute;
top:9px;
left:9px;
background:#111;
color:#fff;
padding:6px 9px;
border-radius:7px;
font-size:10px;
font-weight:bold;
z-index:2;
}

.info{
padding:13px;
}

.cat{
font-size:11px;
color:#888;
margin-bottom:5px;
}

.name{
font-weight:bold;
font-size:15px;
margin-bottom:7px;
}

.price{
font-size:18px;
font-weight:900;
color:#a27800;
margin-bottom:8px;
}

.tags{
display:flex;
gap:5px;
flex-wrap:wrap;
margin-bottom:11px;
}

.tag{
font-size:10px;
background:#f0f0f0;
padding:5px 7px;
border-radius:6px;
}

.add{
width:100%;
padding:11px;
border:0;
border-radius:10px;
background:#111;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.add:hover{
background:#d4af37;
color:#111;
}

/* CART */

.cart{
position:fixed;
right:-430px;
top:0;
width:420px;
max-width:100%;
height:100%;
background:#fff;
z-index:500;
transition:.3s;
box-shadow:-5px 0 25px #0004;
display:flex;
flex-direction:column;
}

.cart.open{
right:0;
}

.cartHead{
background:#111;
color:#fff;
padding:17px;
display:flex;
justify-content:space-between;
align-items:center;
}

.close{
width:34px;
height:34px;
border:0;
border-radius:50%;
background:#333;
color:#fff;
font-size:20px;
cursor:pointer;
}

.cartList{
flex:1;
overflow:auto;
padding:15px;
}

.cartItem{
display:flex;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee;
}

.cartImg{
width:65px;
height:65px;
flex-shrink:0;
overflow:hidden;
border-radius:8px;
background:#eee;
}

.cartImg img{
width:100%;
height:100%;
object-fit:cover;
}

.cartInfo{
flex:1;
}

.qty{
display:flex;
align-items:center;
gap:8px;
margin-top:7px;
}

.qty button{
width:27px;
height:27px;
border:0;
background:#111;
color:#fff;
border-radius:6px;
cursor:pointer;
}

.remove{
border:0;
background:none;
color:red;
margin-left:5px;
cursor:pointer;
}

.cartFoot{
padding:17px;
border-top:1px solid #ddd;
}

.total{
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:bold;
margin-bottom:14px;
}

.checkout{
width:100%;
padding:14px;
border:0;
border-radius:11px;
background:#d4af37;
font-weight:bold;
cursor:pointer;
}

/* ZOOM */

.zoom{
position:fixed;
inset:0;
background:#000d;
z-index:1000;
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.zoom.show{
display:flex;
}

.zoomBox{
background:#fff;
max-width:650px;
width:100%;
border-radius:18px;
padding:15px;
position:relative;
}

.zoomBox img{
width:100%;
max-height:520px;
object-fit:contain;
display:block;
border-radius:12px;
}

.zoomClose{
position:absolute;
right:10px;
top:10px;
width:36px;
height:36px;
border:0;
border-radius:50%;
background:#111;
color:#fff;
font-size:20px;
z-index:3;
cursor:pointer;
}

footer{
background:#111;
color:#fff;
text-align:center;
padding:35px;
}

/* MOBILE */

@media(max-width:1000px){

.products{
grid-template-columns:repeat(3,1fr);
}

.filters{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:650px){

.hero h1{
font-size:28px;
}

.filters{
grid-template-columns:1fr 1fr;
}

.products{
grid-template-columns:repeat(2,1fr);
gap:9px;
}

.pic{
height:210px;
}

.info{
padding:9px;
}

.name{
font-size:13px;
}

.price{
font-size:15px;
}

.cart{
width:100%;
}

}

@media(max-width:380px){

.products{
grid-template-columns:1fr 1fr;
}

.pic{
height:180px;
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
Abdii <span>Market</span>
</div>

<button class="cartBtn" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>

</header>


<section class="hero">

<h1>🔥 Abdii Fashion Market</h1>

<p>
Fashion • Shoes • Kufiya • Watches • Jewelry • Bags
</p>

<div class="search">

<input
id="search"
type="search"
placeholder="Search Jordan 4, Kufiya, Black, Dhiira, Size 42..."
oninput="render()"
>

<button onclick="render()">🔎</button>

</div>

</section>


<div class="filters">

<select id="category" onchange="render()">

<option value="all">🛍️ All Products</option>
<option value="clothes">👕 Uffata</option>
<option value="kufiya">🧢 Kufiya</option>
<option value="pants">👖 Pants</option>
<option value="glasses">🕶️ Eye Glass</option>
<option value="watch">⌚ Watch</option>
<option value="necklace">💎 Necklace</option>
<option value="bag">👜 Borsa</option>

</select>


<select id="gender" onchange="render()">

<option value="all">👥 Gender Hunda</option>
<option value="male">👨 Dhiira</option>
<option value="female">👩 Durba</option>

</select>


<select id="size" onchange="render()">

<option value="all">📏 Size Hunda</option>

<option>XS</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>

<option>38</option>
<option>39</option>
<option>40</option>
<option>41</option>
<option>42</option>
<option>43</option>
<option>44</option>
<option>45</option>

</select>


<select id="color" onchange="render()">

<option value="all">🎨 Color Hunda</option>

<option>Black</option>
<option>White</option>
<option>Red</option>
<option>Blue</option>
<option>Green</option>
<option>Brown</option>
<option>Grey</option>
<option>Pink</option>
<option>Purple</option>
<option>Yellow</option>
<option>Orange</option>
<option>Beige</option>
<option>Cream</option>
<option>Navy</option>
<option>Maroon</option>
<option>Gold</option>
<option>Silver</option>
<option>Khaki</option>
<option>Sky Blue</option>
<option>Dark Green</option>

</select>


<select id="sort" onchange="render()">

<option value="default">↕️ Sort</option>
<option value="low">Gatii xiqqaa → guddaa</option>
<option value="high">Gatii guddaa → xiqqaa</option>

</select>

</div>


<main class="container">

<div class="top">

<h2>🛍️ Products</h2>

<span id="count"></span>

</div>

<div class="products" id="products"></div>

</main>


<!-- CART -->

<div class="cart" id="cart">

<div class="cartHead">

<h2>🛒 Cart</h2>

<button class="close" onclick="closeCart()">×</button>

</div>

<div class="cartList" id="cartList"></div>

<div class="cartFoot">

<div class="total">

<span>Total</span>

<span id="total">0 ETB</span>

</div>

<button class="checkout" onclick="checkout()">

💳 Chapa Checkout

</button>

</div>

</div>


<!-- ZOOM -->

<div class="zoom" id="zoom" onclick="closeZoom()">

<div class="zoomBox" onclick="event.stopPropagation()">

<button class="zoomClose" onclick="closeZoom()">
×
</button>

<div id="zoomImage"></div>

<h2 id="zoomName" style="margin-top:10px"></h2>

<p
id="zoomPrice"
style="color:#a27800;font-weight:bold;margin-top:6px">
</p>

</div>

</div>


<footer>

<h3>Abdii Market</h3>

<p style="color:#aaa;margin-top:8px">
Your Fashion Marketplace
</p>

<p style="color:#777;margin-top:15px">
© 2026 Abdii Market
</p>

</footer>


<script>

/* ================================
   COLORS
================================ */

const COLORS = [
"Black",
"White",
"Red",
"Blue",
"Green",
"Brown",
"Grey",
"Pink",
"Purple",
"Yellow",
"Orange",
"Beige",
"Cream",
"Navy",
"Maroon",
"Gold",
"Silver",
"Khaki",
"Sky Blue",
"Dark Green"
];

const SIZES = [
"XS","S","M","L","XL","XXL",
"38","39","40","41","42","43","44","45"
];


/* ================================
   PRODUCTS
================================ */

const products = [];

let ID = 1;


function addProduct(
name,
category,
gender,
color,
size,
price,
keywords=[]
){

products.push({

id:ID++,

name:name,

category:category,

gender:gender,

color:color,

size:size,

price:price,

keywords:keywords

});

}


/* 80 CLOTHES */

for(let i=1;i<=80;i++){

const gender =
i <= 40 ? "male" : "female";

const color =
COLORS[(i-1)%20];

const size =
SIZES[(i-1)%SIZES.length];

let name;

if(i===1){

name="Jordan 4 Fashion Shirt";

}else{

name =
gender==="male"
?`Men Fashion Shirt ${i}`
:`Women Fashion Dress ${i}`;

}

addProduct(

name,

"clothes",

gender,

color,

size,

3000 + (i%15)*500,

[
"fashion",
"uffata",
"shirt",
"dress",
"jordan 4",
color,
size,
gender==="male"?"dhiira":"durba"
]

);

}


/* 20 KUFIYA */

for(let i=1;i<=20;i++){

const gender =
i<=10 ? "male" : "female";

const color =
COLORS[(i+5)%20];

addProduct(

`Kufiya Fashion ${i}`,

"kufiya",

gender,

color,

"Free",

2000+(i%8)*500,

[
"kufiya",
"headwear",
color,
gender==="male"?"dhiira":"durba"
]

);

}


/* 20 PANTS */

for(let i=1;i<=20;i++){

const gender =
i<=10 ? "male" : "female";

const color =
COLORS[(i+3)%20];

const size =
SIZES[(i+2)%SIZES.length];

addProduct(

gender==="male"
?`Men Pant ${i}`
:`Women Pant ${i}`,

"pants",

gender,

color,

size,

5000+(i%8)*500,

[
"pant",
"pants",
color,
size,
gender==="male"?"dhiira":"durba"
]

);

}


/* 20 EYEGLASS */

const glassColors=[
"Black",
"Brown",
"Clear",
"Gold",
"Silver",
"Black",
"Brown",
"Clear",
"Gold",
"Silver"
];

for(let i=1;i<=20;i++){

const gender =
i<=10 ? "male" : "female";

const color =
glassColors[(i-1)%10];

addProduct(

gender==="male"
?`Men Eyeglass ${i}`
:`Women Eyeglass ${i}`,

"glasses",

gender,

color,

"Free",

2500+(i%7)*500,

[
"eyeglass",
"eye glass",
"glasses",
color,
gender==="male"?"dhiira":"durba"
]

);

}


/* 20 WATCH */

for(let i=1;i<=20;i++){

const gender =
i<=10 ? "male" : "female";

const color =
COLORS[(i+8)%20];

addProduct(

gender==="male"
?`Men Watch ${i}`
:`Women Watch ${i}`,

"watch",

gender,

color,

"Free",

7000+(i%8)*1000,

[
"watch",
"sa'aatii",
"wrist watch",
color
]

);

}


/* 10 NECKLACE */

for(let i=1;i<=10;i++){

const gender =
i<=5 ? "male" : "female";

const color =
i%2 ? "Gold" : "Silver";

addProduct(

`Necklace ${i}`,

"necklace",

gender,

color,

"Free",

6000+(i%5)*1000,

[
"necklace",
"warqee",
"morma",
"gold",
color
]

);

}


/* 10 BAGS */

for(let i=1;i<=10;i++){

const gender =
i<=5 ? "male" : "female";

const color =
COLORS[(i+11)%20];

addProduct(

gender==="male"
?`Men Bag ${i}`
:`Women Bag ${i}`,

"bag",

gender,

color,

"Free",

4500+(i%7)*1000,

[
"bag",
"borsa",
color,
gender==="male"?"dhiira":"durba"
]

);

}


/* ================================
   IMAGE SYSTEM
================================ */

/*
IMPORTANT:

Your real product photos must be here:

images/product-1.jpg
images/product-2.jpg
...
images/product-180.jpg

If a product image is missing,
no-image.jpg will be shown.
*/

const IMAGE_FOLDER = "images/";


function imageURL(id){

return IMAGE_FOLDER +
"product-" +
id +
".jpg";

}


function fallbackImage(){

return IMAGE_FOLDER +
"no-image.jpg";

}


function productImage(product){

return `

<img
src="${imageURL(product.id)}"
alt="${product.name}"
loading="lazy"
onerror="this.onerror=null;this.src='${fallbackImage()}'"
>

`;

}


/* ================================
   SEARCH / FILTER
================================ */

function render(){

const q =
document
.getElementById("search")
.value
.toLowerCase()
.trim();

const category =
document.getElementById("category")
.value;

const gender =
document.getElementById("gender")
.value;

const size =
document.getElementById("size")
.value;

const color =
document.getElementById("color")
.value;

const sort =
document.getElementById("sort")
.value;


let list =
products.filter(product=>{

const text = [

product.name,
product.category,
product.gender,
product.gender==="male"
?"dhiira"
:"durba",
product.color,
product.size,
...product.keywords

]
.join(" ")
.toLowerCase();


return (

(!q || text.includes(q))

&&

(
category==="all"
||
product.category===category
)

&&

(
gender==="all"
||
product.gender===gender
)

&&

(
size==="all"
||
product.size===size
)

&&

(
color==="all"
||
product.color===color
)

);

});


if(sort==="low"){

list.sort(
(a,b)=>a.price-b.price
);

}


if(sort==="high"){

list.sort(
(a,b)=>b.price-a.price
);

}


document
.getElementById("count")
.textContent =
list.length +
" products";


const box =
document.getElementById("products");

box.innerHTML = "";


if(!list.length){

box.innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:70px;
color:#777">

<h2>😔</h2>

<p style="margin-top:10px">
Product hin argamne.
</p>

</div>

`;

return;

}


list.forEach(product=>{

const card =
document.createElement("div");

card.className="card";


card.innerHTML = `

<div
class="pic"
onclick="zoomProduct(${product.id})"
>

<div class="badge">

${
product.gender==="male"
?"👨 DHIIRA"
:"👩 DURBA"
}

</div>

${productImage(product)}

</div>


<div class="info">

<div class="cat">

${product.category.toUpperCase()}

</div>


<div class="name">

${product.name}

</div>


<div class="price">

${product.price.toLocaleString()}
ETB

</div>


<div class="tags">

<span class="tag">
🎨 ${product.color}
</span>

<span class="tag">
📏 ${product.size}
</span>

<span class="tag">

${
product.gender==="male"
?"👨 Dhiira"
:"👩 Durba"
}

</span>

</div>


<button
class="add"
onclick="addCart(${product.id})"
>

🛒 Add to Cart

</button>

</div>

`;


box.appendChild(card);

});

}


/* ================================
   CART
================================ */

let cart =
JSON.parse(
localStorage.getItem(
"abdiiMarketCart"
)
) || [];


function saveCart(){

localStorage.setItem(

"abdiiMarketCart",

JSON.stringify(cart)

);

}


function addCart(id){

const product =
products.find(
p=>p.id===id
);

if(!product)return;


const old =
cart.find(
p=>p.id===id
);


if(old){

old.qty++;

}else{

cart.push({

id:product.id,

name:product.name,

price:product.price,

qty:1

});

}


saveCart();

updateCart();

openCart();

}


function updateCart(){

const box =
document.getElementById("cartList");

box.innerHTML="";


let total=0;

let count=0;


cart.forEach(item=>{

total +=
item.price *
item.qty;

count +=
item.qty;


const product =
products.find(
p=>p.id===item.id
);


const div =
document.createElement("div");

div.className="cartItem";


div.innerHTML = `

<div class="cartImg">

${
product
?productImage(product)
:""
}

</div>


<div class="cartInfo">

<strong>
${item.name}
</strong>

<div style="margin-top:4px">

${item.price.toLocaleString()}
ETB

</div>


<div class="qty">

<button
onclick="changeQty(${item.id},-1)"
>
−
</button>

<span>
${item.qty}
</span>

<button
onclick="changeQty(${item.id},1)"
>
+
</button>

<button
class="remove"
onclick="removeItem(${item.id})"
>
Remove
</button>

</div>

</div>

`;


box.appendChild(div);

});


if(!cart.length){

box.innerHTML = `

<div style="
text-align:center;
padding:60px;
color:#777">

<div style="font-size:40px">
🛒
</div>

<p style="margin-top:10px">
Cart kee duwwaa dha.
</p>

</div>

`;

}


document
.getElementById("cartCount")
.textContent=count;


document
.getElementById("total")
.textContent =
total.toLocaleString() +
" ETB";

}


function changeQty(id,number){

const item =
cart.find(
p=>p.id===id
);

if(!item)return;


item.qty += number;


if(item.qty<=0){

cart =
cart.filter(
p=>p.id!==id
);

}


saveCart();

updateCart();

}


function removeItem(id){

cart =
cart.filter(
p=>p.id!==id
);

saveCart();

updateCart();

}


/* ================================
   CART OPEN / CLOSE
================================ */

function openCart(){

document
.getElementById("cart")
.classList.add("open");

}


function closeCart(){

document
.getElementById("cart")
.classList.remove("open");

}


/* ================================
   PRODUCT ZOOM
================================ */

function zoomProduct(id){

const product =
products.find(
p=>p.id===id
);

if(!product)return;


document
.getElementById("zoomImage")
.innerHTML =
productImage(product);


document
.getElementById("zoomName")
.textContent =
product.name;


document
.getElementById("zoomPrice")
.textContent =
product.price.toLocaleString() +
" ETB";


document
.getElementById("zoom")
.classList.add("show");

}


function closeZoom(){

document
.getElementById("zoom")
.classList.remove("show");

}


/* ================================
   CHAPA
================================ */

function checkout(){

if(!cart.length){

alert(
"Cart kee duwwaa dha."
);

return;

}


const total =
cart.reduce(

(sum,item)=>
sum +
item.price *
item.qty,

0

);


/*
----------------------------------
CHAPA BACKEND
----------------------------------

fetch("/api/checkout",{

method:"POST",
