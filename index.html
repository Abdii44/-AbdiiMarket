<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdii Market | Fashion Marketplace</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;color:#111
}
header{
position:sticky;top:0;z-index:100;
background:#111;color:white;padding:14px
}
.nav{
max-width:1250px;margin:auto;
display:flex;align-items:center;
justify-content:space-between;gap:10px
}
.logo{font-size:24px;font-weight:900}
.logo span{color:#d4af37}
.cartBtn{
background:#d4af37;border:0;
padding:11px 16px;border-radius:12px;
font-weight:bold;cursor:pointer
}
.hero{
background:linear-gradient(135deg,#050505,#252525);
color:white;text-align:center;
padding:45px 15px
}
.hero h1{font-size:38px;margin-bottom:8px}
.hero p{color:#ccc;margin-bottom:20px}
.search{
max-width:750px;margin:auto;
background:white;border-radius:15px;
display:flex;overflow:hidden
}
.search input{
flex:1;border:0;outline:0;
padding:16px;font-size:16px
}
.search button{
width:58px;border:0;
background:#d4af37;font-size:20px
}
.filters{
max-width:1250px;margin:18px auto;
padding:0 15px;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:9px
}
select{
width:100%;padding:12px;
border:1px solid #ddd;
border-radius:10px;background:white
}
.container{
max-width:1250px;margin:auto;
padding:10px 15px 50px
}
.top{
display:flex;justify-content:space-between;
align-items:center;margin:20px 0
}
.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px
}
.card{
background:white;border-radius:17px;
overflow:hidden;
box-shadow:0 3px 15px #00000012;
transition:.2s
}
.card:hover{transform:translateY(-4px)}
.pic{
height:245px;background:#eee;
position:relative;overflow:hidden;
cursor:zoom-in
}
.pic svg{
width:100%;height:100%;
transition:.3s
}
.pic:hover svg{transform:scale(1.08)}
.badge{
position:absolute;top:9px;left:9px;
background:#111;color:white;
padding:6px 8px;border-radius:7px;
font-size:10px;font-weight:bold;z-index:2
}
.info{padding:13px}
.cat{font-size:11px;color:#888;margin-bottom:5px}
.name{font-weight:bold;font-size:15px;margin-bottom:7px}
.price{
font-size:18px;font-weight:900;
color:#a27800;margin-bottom:8px
}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.tag{
font-size:10px;background:#f0f0f0;
padding:5px 7px;border-radius:6px
}
.add{
width:100%;padding:11px;
border:0;border-radius:10px;
background:#111;color:white;
font-weight:bold;cursor:pointer
}
.add:hover{background:#d4af37;color:#111}

/* CART */
.cart{
position:fixed;right:-430px;top:0;
width:420px;max-width:100%;
height:100%;background:white;
z-index:500;transition:.3s;
box-shadow:-5px 0 25px #0004;
display:flex;flex-direction:column
}
.cart.open{right:0}
.cartHead{
background:#111;color:white;
padding:17px;
display:flex;justify-content:space-between;
align-items:center
}
.close{
width:34px;height:34px;
border:0;border-radius:50%;
background:#333;color:white;
font-size:20px;cursor:pointer
}
.cartList{flex:1;overflow:auto;padding:15px}
.cartItem{
display:flex;gap:10px;
padding:12px 0;
border-bottom:1px solid #eee
}
.cartImg{width:65px;height:65px}
.cartImg svg{width:100%;height:100%}
.cartInfo{flex:1}
.qty{
display:flex;align-items:center;
gap:8px;margin-top:7px
}
.qty button{
width:27px;height:27px;
border:0;background:#111;
color:white;border-radius:6px
}
.remove{
border:0;background:none;
color:red;margin-left:5px
}
.cartFoot{
padding:17px;border-top:1px solid #ddd
}
.total{
display:flex;justify-content:space-between;
font-size:20px;font-weight:bold;
margin-bottom:14px
}
.checkout{
width:100%;padding:14px;
border:0;border-radius:11px;
background:#d4af37;font-weight:bold;
cursor:pointer
}

/* ZOOM */
.zoom{
position:fixed;inset:0;
background:#000d;z-index:1000;
display:none;align-items:center;
justify-content:center;padding:15px
}
.zoom.show{display:flex}
.zoomBox{
background:white;max-width:600px;
width:100%;border-radius:18px;
padding:15px;position:relative
}
.zoomBox svg{width:100%;height:500px}
.zoomClose{
position:absolute;right:10px;top:10px;
width:36px;height:36px;
border:0;border-radius:50%;
background:#111;color:white;font-size:20px
}
footer{
background:#111;color:white;
text-align:center;padding:35px
}

@media(max-width:1000px){
.products{grid-template-columns:repeat(3,1fr)}
.filters{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
.hero h1{font-size:28px}
.filters{grid-template-columns:1fr 1fr}
.products{
grid-template-columns:repeat(2,1fr);
gap:9px
}
.pic{height:185px}
.info{padding:9px}
.name{font-size:13px}
.price{font-size:15px}
.cart{width:100%}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">Abdii <span>Market</span></div>

<button class="cartBtn" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>
</div>
</header>

<section class="hero">

<h1>🔥 Abdii Fashion Market</h1>

<p>
Fashion • Shoes • Kufiya • Watches • Jewelry • Bags
</p>

<div class="search">
<input
id="search"
type="search"
placeholder="Search Jordan 4, Kufiya, Black, Dhiira, Size 42..."
oninput="render()">
<button>🔎</button>
</div>

</section>

<div class="filters">

<select id="category" onchange="render()">
<option value="all">🛍️ All Products</option>
<option value="clothes">👕 Uffata</option>
<option value="kufiya">🧢 Kufiya</option>
<option value="pants">👖 Pants</option>
<option value="glasses">🕶️ Eye Glass</option>
<option value="watch">⌚ Watch</option>
<option value="necklace">💎 Necklace</option>
<option value="bag">👜 Borsa</option>
</select>

<select id="gender" onchange="render()">
<option value="all">👥 Gender Hunda</option>
<option value="male">👨 Dhiira</option>
<option value="female">👩 Durba</option>
</select>

<select id="size" onchange="render()">
<option value="all">📏 Size Hunda</option>
<option>XS</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>38</option>
<option>39</option>
<option>40</option>
<option>41</option>
<option>42</option>
<option>43</option>
<option>44</option>
<option>45</option>
</select>

<select id="color" onchange="render()">
<option value="all">🎨 Color Hunda</option>
<option>Black</option>
<option>White</option>
<option>Red</option>
<option>Blue</option>
<option>Green</option>
<option>Brown</option>
<option>Grey</option>
<option>Pink</option>
<option>Purple</option>
<option>Yellow</option>
<option>Orange</option>
<option>Beige</option>
<option>Cream</option>
<option>Navy</option>
<option>Maroon</option>
<option>Gold</option>
<option>Silver</option>
<option>Khaki</option>
<option>Sky Blue</option>
<option>Dark Green</option>
</select>

<select id="sort" onchange="render()">
<option value="default">↕️ Sort</option>
<option value="low">Gatii xiqqaa → guddaa</option>
<option value="high">Gatii guddaa → xiqqaa</option>
</select>

</div>

<main class="container">

<div class="top">
<h2>🛍️ Products</h2>
<span id="count"></span>
</div>

<div class="products" id="products"></div>

</main>


<!-- CART -->

<div class="cart" id="cart">

<div class="cartHead">

<h2>🛒 Cart</h2>

<button class="close" onclick="closeCart()">×</button>

</div>

<div class="cartList" id="cartList"></div>

<div class="cartFoot">

<div class="total">
<span>Total</span>
<span id="total">0 ETB</span>
</div>

<button class="checkout" onclick="checkout()">
💳 Chapa Checkout
</button>

</div>

</div>


<!-- ZOOM -->

<div class="zoom" id="zoom" onclick="closeZoom()">

<div class="zoomBox" onclick="event.stopPropagation()">

<button class="zoomClose" onclick="closeZoom()">×</button>

<div id="zoomImage"></div>

<h2 id="zoomName" style="margin-top:10px"></h2>

<p
id="zoomPrice"
style="color:#a27800;font-weight:bold;margin-top:6px">
</p>

</div>

</div>


<footer>

<h3>Abdii Market</h3>

<p style="color:#aaa;margin-top:8px">
Your Fashion Marketplace
</p>

<p style="color:#777;margin-top:15px">
© 2026 Abdii Market
</p>

</footer>


<script>

/* =========================
   COLORS
========================= */

const COLORS=[
"Black","White","Red","Blue","Green",
"Brown","Grey","Pink","Purple","Yellow",
"Orange","Beige","Cream","Navy","Maroon",
"Gold","Silver","Khaki","Sky Blue","Dark Green"
];

const COLOR_CODE={
Black:"#111",
White:"#eee",
Red:"#c62828",
Blue:"#1565c0",
Green:"#16833b",
Brown:"#704214",
Grey:"#777",
Pink:"#e91e63",
Purple:"#7b1fa2",
Yellow:"#f2c500",
Orange:"#ef6c00",
Beige:"#d9c3a5",
Cream:"#fff4d6",
Navy:"#14213d",
Maroon:"#6d071a",
Gold:"#d4af37",
Silver:"#aaa",
Khaki:"#8b8b5a",
"Sky Blue":"#5dade2",
"Dark Green":"#075e36"
};

const SIZES=[
"XS","S","M","L","XL","XXL",
"38","39","40","41","42","43","44","45"
];


/* =========================
   PRODUCT SVG
========================= */

function svg(type,color,number){

let c=COLOR_CODE[color]||"#111";

if(type==="clothes"){

return `
<svg viewBox="0 0 400 400">
<rect width="400" height="400" fill="#f2f2f2"/>

<ellipse cx="200" cy="345"
rx="105" ry="15" fill="#0002"/>

<path
d="M145 75L85 120L115 180L145 160V310H255V160L285 180L315 120L255 75L225 60H175Z"
fill="${c}"
stroke="#222"
stroke-width="4"/>

<path
d="M175 60Q200 100 225 60"
fill="none"
stroke="#222"
stroke-width="5"/>

<text x="200" y="280"
text-anchor="middle"
font-family="Arial"
font-size="18"
font-weight="bold"
fill="${color==="White"?"#222":"#fff"}">
ABDII
</text>
</svg>`;
}

if(type==="kufiya"){

return `
<svg viewBox="0 0 400 400">
<rect width="400" height="400" fill="#f2f2f2"/>

<path
d="M95 180L120 85H280L305 180L270 160L250 210H150L130 160Z"
fill="${c}"
stroke="#222"
stroke-width="4"/>

<path
d="M125 110L275 180M105 145L260 215M275 110L125 180M295 145L140 215"
stroke="#fff8"
stroke-width="8"/>

<path
d="M145 210L130 300M175 210L165 310M205 210L200 315M235 210L245 310M265 210L280 300"
stroke="${c}"
stroke-width="14"/>

<text x="200" y="350"
text-anchor="middle"
font-size="17"
font-weight="bold">
ABDII KUFIYA
</text>
</svg>`;
}

if(type==="pants"){

return `
<svg viewBox="0 0 400 400">
<rect width="400" height="400" fill="#f2f2f2"/>

<path
d="M125 65H275L255 190L300 330H225L200 205L175 330H100L145 190Z"
fill="${c}"
stroke="#222"
stroke-width="4"/>

<path
d="M200 70V205"
stroke="#fff7"
stroke-width="5"/>

<text x="200" y="365"
text-anchor="middle"
font-size="18"
font-weight="bold">
ABDII PANTS
</text>
</svg>`;
}

if(type==="glasses"){

return `
<svg viewBox="0 0 400 400">
<rect width="400" height="400" fill="#f2f2f2"/>

<circle cx="130" cy="190"
r="58" fill="${c}" opacity=".75"
stroke="#111" stroke-width="10"/>

<circle cx="270" cy="190"
r="58" fill="${c}" opacity=".75"
stroke="#111" stroke-width="10"/>

<path d="M188 188Q200 175 212 188"
stroke="#111" stroke-width="10"/>

<path d="M70 170L35 155M330 170L365 155"
stroke="#111" stroke-width="10"/>

<text x="200" y="330"
text-anchor="middle"
font-size="18"
font-weight="bold">
ABDII EYEGLASS
</text>
</svg>`;
}

if(type==="watch"){

return `
<svg viewBox="0 0 400 400">
<rect width="400" height="400" fill="#f2f2f2"/>

<rect x="145" y="40"
width="110" height="320"
rx="50"
fill="${c}"/>

<circle cx="200" cy="200"
r="82" fill="#eee"
stroke="#111" stroke-width="10"/>

<circle cx="200" cy="200"
r="67" fill="#fff"
stroke="${c}" stroke-width="7"/>

<path d="M200 200V150M200 200L238 220"
stroke="#111" stroke-width="7"/>

<circle cx="200" cy="200" r="7"/>

<text x="200" y="330"
text-anchor="middle"
font-size="18"
font-weight="bold">
ABDII WATCH
</text>
</svg>`;
}

if(type==="necklace"){

return `
<svg viewBox="0 0 400 400">
<rect width="400" height="400" fill="#f2f2f2"/>

<path
d="M80 75Q200 280 320 75"
fill="none"
stroke="${c}"
stroke-width="18"/>

<circle cx="200" cy="270"
r="38" fill="${c}"
stroke="#222" stroke-width="5"/>

<text x="200" y="350"
text-anchor="middle"
font-size="18"
font-weight="bold">
ABDII JEWELRY
</text>
</svg>`;
}

if(type==="bag"){

return `
<svg viewBox="0 0 400 400">
<rect width="400" height="400" fill="#f2f2f2"/>

<path
d="M90 140H310L325 320H75Z"
fill="${c}"

<path
d="M140 140Q140 55 200 55Q260 55 260 140"
fill="none"
stroke="${c}"
stroke-width="18"/>

<rect x="145" y="205"
width="110" height="60"
rx="8"
fill="#fff4"
stroke="#fff6"/>

<text x="200" y="245"
text-anchor="middle"
font-size="22"
font-weight="bold">
A
</text>

<text x="200" y="355"
text-anchor="middle"
font-size="18"
font-weight="bold">
ABDII BAG
</text>
</svg>`;
}

}


/* =========================
   PRODUCTS
========================= */

const products=[];
let ID=1;

function add(
name,category,gender,color,
size,price,type,keywords=[]
){

products.push({
id:ID++,
name,
category,
gender,
color,
size,
price,
type,
keywords
});

}


/* 80 UFFATA */

for(let i=1;i<=80;i++){

let gender=i<=40?"male":"female";

let color=COLORS[(i-1)%20];

let size=SIZES[(i-1)%SIZES.length];

let name;

if(i===1)
name="Jordan 4 Inspired Fashion Shirt";

else
name=gender==="male"
?`Men Fashion Shirt ${i}`
:`Women Fashion Dress ${i}`;

add(
name,
"clothes",
gender,
color,
size,
3000+(i%15)*500,
"clothes",
[
"fashion",
"uffata",
gender==="male"?"dhiira":"durba",
color,
size,
"Jordan 4"
]
);

}


/* 20 KUFIYA */

for(let i=1;i<=20;i++){

let gender=i<=10?"male":"female";
let color=COLORS[(i+5)%20];

add(
`Kufiya Fashion ${i}`,
"kufiya",
gender,
color,
"Free",
2000+(i%8)*500,
"kufiya",
["kufiya","headwear",color]
);

}


/* 20 PANTS */

for(let i=1;i<=20;i++){

let gender=i<=10?"male":"female";
let color=COLORS[(i+3)%20];
let size=SIZES[(i+2)%SIZES.length];

add(
gender==="male"
?`Men Pant ${i}`
:`Women Pant ${i}`,
"pants",
gender,
color,
size,
5000+(i%8)*500,
"pants",
["pant","pants",color,size]
);

}


/* 20 EYEGLASS */

for(let i=1;i<=20;i++){

let gender=i<=10?"male":"female";

let glassColors=[
"Black","Brown","Clear","Gold","Silver",
"Black","Brown","Clear","Gold","Silver"
];

let color=glassColors[(i-1)%10];

add(
gender==="male"
?`Men Eyeglass ${i}`
:`Women Eyeglass ${i}`,
"glasses",
gender,
color,
"Free",
2500+(i%7)*500,
"glasses",
[
"eyeglass",
"eye glass",
"glasses",
color
]
);

}


/* 20 WATCH */

for(let i=1;i<=20;i++){

let gender=i<=10?"male":"female";
let color=COLORS[(i+8)%20];

add(
gender==="male"
?`Men Watch ${i}`
:`Women Watch ${i}`,
"watch",
gender,
color,
"Free",
7000+(i%8)*1000,
"watch",
["watch","sa'aatii",color]
);

}


/* 10 NECKLACE */

for(let i=1;i<=10;i++){

let gender=i<=5?"male":"female";

add(
`Gold Necklace ${i}`,
"necklace",
gender,
i%2?"Gold":"Silver",
"Free",
6000+(i%5)*1000,
"necklace",
["necklace","warqee","morma","gold"]
);

}


/* 10 BAG */

for(let i=1;i<=10;i++){

let gender=i<=5?"male":"female";
let color=COLORS[(i+11)%20];

add(
gender==="male"
?`Men Bag ${i}`
:`Women Bag ${i}`,
"bag",
gender,
color,
"Free",
4500+(i%7)*1000,
"bag",
["bag","borsa",color]
);

}


/* =========================
   SEARCH
========================= */

let cart=
JSON.parse(
localStorage.getItem("abdiiMarketCart")
)||[];


function render(){

const q=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const category=
document.getElementById("category").value;

const gender=
document.getElementById("gender").value;

const size=
document.getElementById("size").value;

const color=
document.getElementById("color").value;

const sort=
document.getElementById("sort").value;

let list=products.filter(p=>{

let text=[
p.name,
p.category,
p.gender,
p.gender==="male"?"dhiira":"durba",
p.color,
p.size,
...p.keywords
].join(" ").toLowerCase();

return(
(!q||text.includes(q))
&&
(category==="all"||p.category===category)
&&
(gender==="all"||p.gender===gender)
&&
(size==="all"||p.size===size)
&&
(color==="all"||p.color===color)
);

});


if(sort==="low")
list.sort((a,b)=>a.price-b.price);

if(sort==="high")
list.sort((a,b)=>b.price-a.price);


document.getElementById("count")
.textContent=list.length+" products";

const box=
document.getElementById("products");

box.innerHTML="";


if(!list.length){

box.innerHTML=`
<div style="
grid-column:1/-1;
text-align:center;
padding:60px;
color:#777">
😔 Product hin argamne.
</div>`;

return;

}


list.forEach(p=>{

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div
class="pic"
onclick="zoomProduct(${p.id})">

<div class="badge">
${p.gender==="male"?"DHIIRA":"DURBA"}
</div>

${svg(p.type,p.color,p.id)}

</div>

<div class="info">

<div class="cat">
${p.category.toUpperCase()}
</div>

<div class="name">
${p.name}
</div>

<div class="price">
${p.price.toLocaleString()} ETB
</div>

<div class="tags">

<span class="tag">
🎨 ${p.color}
</span>

<span class="tag">
📏 ${p.size}
</span>

<span class="tag">
${p.gender==="male"?"👨 Dhiira":"👩 Durba"}
</span>

</div>

<button
class="add"
onclick="addCart(${p.id})">
🛒 Add to Cart
</button>

</div>
`;

box.appendChild(card);

});

}


/* =========================
   CART
========================= */

function addCart(id){

let p=
products.find(x=>x.id===id);

let old=
cart.find(x=>x.id===id);

if(old)
old.qty++;

else
cart.push({
id:p.id,
name:p.name,
price:p.price,
type:p.type,
color:p.color,
qty:1
});

saveCart();
updateCart();
openCart();

}

function saveCart(){

localStorage.setItem(
"abdiiMarketCart",
JSON.stringify(cart)
);

}

function updateCart(){

let box=
document.getElementById("cartList");

box.innerHTML="";

let total=0;
let count=0;

cart.forEach(item=>{

total+=item.price*item.qty;
count+=item.qty;

let div=
document.createElement("div");

div.className="cartItem";

div.innerHTML=`

<div class="cartImg">
${svg(item.type,item.color,item.id)}
</div>

<div class="cartInfo">

<strong>${item.name}</strong>

<div>
${item.price.toLocaleString()} ETB
</div>

<div class="qty">

<button
onclick="changeQty(${item.id},-1)">
−
</button>

<span>${item.qty}</span>

<button
onclick="changeQty(${item.id},1)">
+
</button>

<button
class="remove"
onclick="removeItem(${item.id})">
Remove
</button>

</div>

</div>
`;

box.appendChild(div);

});


if(!cart.length){

box.innerHTML=`
<div style="
text-align:center;
padding:60px;
color:#777">
🛒 Cart kee duwwaa dha.
</div>`;

}

document.getElementById("cartCount")
.textContent=count;

document.getElementById("total")
.textContent=
total.toLocaleString()+" ETB";

}

function changeQty(id,n){

let item=
cart.find(x=>x.id===id);

if(!item)return;

item.qty+=n;

if(item.qty<=0){

cart=
cart.filter(x=>x.id!==id);

}

saveCart();
updateCart();

}

function removeItem(id){

cart=
cart.filter(x=>x.id!==id);

saveCart();
updateCart();

}


/* =========================
   CART OPEN
========================= */

function openCart(){

document
.getElementById("cart")
.classList.add("open");

}

function closeCart(){

document
.getElementById("cart")
.classList.remove("open");

}


/* =========================
   ZOOM
========================= */

function zoomProduct(id){

let p=
products.find(x=>x.id===id);

document.getElementById("zoomImage")
.innerHTML=
svg(p.type,p.color,p.id);

document.getElementById("zoomName")
.textContent=p.name;

document.getElementById("zoomPrice")
.textContent=
p.price.toLocaleString()+" ETB";

document
.getElementById("zoom")
.classList.add("show");

}

function closeZoom(){

document
.getElementById("zoom")
.classList.remove("show");

}
