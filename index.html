<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdii Market — Fashion</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f6f6f6;
  color:#111
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  color:white;
  padding:14px
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  font-size:23px;
  font-weight:900
}

.logo span{color:#d4af37}

.cart-btn{
  background:#d4af37;
  border:0;
  padding:11px 16px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer
}

.hero{
  background:linear-gradient(135deg,#050505,#292929);
  color:white;
  text-align:center;
  padding:48px 15px
}

.hero h1{
  font-size:36px;
  margin-bottom:10px
}

.hero p{
  color:#ccc;
  margin-bottom:22px
}

.search{
  max-width:680px;
  margin:auto;
  background:white;
  display:flex;
  border-radius:15px;
  overflow:hidden
}

.search input{
  flex:1;
  border:0;
  outline:0;
  padding:16px;
  font-size:16px
}

.search button{
  width:60px;
  border:0;
  background:#d4af37;
  font-size:20px
}

.filters{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.filters select{
  padding:13px;
  border:1px solid #ddd;
  border-radius:11px;
  background:white
}

.container{
  max-width:1200px;
  margin:auto;
  padding:10px 15px 50px
}

.top{
  display:flex;
  justify-content:space-between;
  margin:20px 0
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px #00000012;
  transition:.25s
}

.card:hover{
  transform:translateY(-5px)
}

.product-img{
  height:250px;
  position:relative;
  overflow:hidden;
  cursor:zoom-in;
  background:#f1f1f1
}

.product-img svg{
  width:100%;
  height:100%;
  transition:.3s
}

.product-img:hover svg{
  transform:scale(1.08)
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  z-index:3;
  background:#111;
  color:white;
  padding:6px 9px;
  border-radius:7px;
  font-size:10px;
  font-weight:bold
}

.body{
  padding:14px
}

.category{
  color:#888;
  font-size:11px;
  margin-bottom:5px
}

.name{
  font-size:16px;
  font-weight:bold;
  margin-bottom:8px
}

.price{
  color:#a77d00;
  font-size:18px;
  font-weight:900;
  margin-bottom:10px
}

.tags{
  display:flex;
  gap:5px;
  margin-bottom:12px;
  flex-wrap:wrap
}

.tag{
  background:#f0f0f0;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px
}

.add{
  width:100%;
  border:0;
  background:#111;
  color:white;
  padding:11px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer
}

.add:hover{
  background:#d4af37;
  color:#111
}

/* CART */

.cart{
  position:fixed;
  right:-430px;
  top:0;
  width:420px;
  max-width:100%;
  height:100%;
  background:white;
  z-index:500;
  transition:.3s;
  box-shadow:-5px 0 25px #0004;
  display:flex;
  flex-direction:column
}

.cart.open{right:0}

.cart-head{
  background:#111;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between
}

.close{
  background:#333;
  color:white;
  border:0;
  width:33px;
  height:33px;
  border-radius:50%;
  cursor:pointer
}

.cart-list{
  flex:1;
  overflow:auto;
  padding:15px
}

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee
}

.cart-item svg{
  width:65px;
  height:65px;
  border-radius:9px;
  background:#eee
}

.cart-info{
  flex:1
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px
}

.qty button{
  width:27px;
  height:27px;
  border:0;
  background:#111;
  color:white;
  border-radius:6px
}

.remove{
  border:0;
  background:none;
  color:red;
  margin-left:7px
}

.cart-footer{
  padding:18px;
  border-top:1px solid #ddd
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px
}

.checkout{
  width:100%;
  border:0;
  background:#d4af37;
  padding:14px;
  border-radius:11px;
  font-weight:bold
}

/* ZOOM */

.zoom{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#000d;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px
}

.zoom.open{display:flex}

.zoom-box{
  max-width:600px;
  width:100%;
  background:white;
  border-radius:18px;
  padding:15px;
  position:relative
}

.zoom-box svg{
  width:100%;
  height:500px
}

.zoom-close{
  position:absolute;
  right:10px;
  top:10px;
  z-index:5;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#111;
  color:white;
  font-size:20px
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:35px
}

@media(max-width:900px){
  .products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:600px){

  .hero h1{font-size:28px}

  .filters{
    grid-template-columns:1fr 1fr
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px
  }

  .product-img{height:190px}

  .body{padding:10px}

  .name{font-size:14px}

  .price{font-size:16px}
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
Abdii <span>Market</span>
</div>

<button class="cart-btn" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>
</header>

<section class="hero">

<h1>✨ Abdii Fashion</h1>

<p>
Premium Fashion • Men • Women
</p>

<div class="search">

<input
id="search"
placeholder="Search fashion, color, category..."
oninput="render()"
>

<button>🔎</button>

</div>

</section>

<div class="filters">

<select id="category" onchange="render()">
<option value="all">All Categories</option>
<option value="clothes">👕 Clothes</option>
<option value="shoes">👟 Shoes</option>
<option value="pants">👖 Pants</option>
<option value="glasses">🕶️ Eye Glass</option>
<option value="watch">⌚ Watch</option>
<option value="necklace">📿 Necklace</option>
<option value="bag">👜 Bag</option>
</select>

<select id="gender" onchange="render()">
<option value="all">All Gender</option>
<option value="male">👨 Men</option>
<option value="female">👩 Women</option>
</select>

<select id="color" onchange="render()">
<option value="all">All Colors</option>
<option>Black</option>
<option>White</option>
<option>Red</option>
<option>Blue</option>
<option>Green</option>
<option>Yellow</option>
<option>Pink</option>
<option>Purple</option>
<option>Brown</option>
<option>Gold</option>
<option>Silver</option>
</select>

<select id="sort" onchange="render()">
<option value="default">Sort Products</option>
<option value="low">Price Low → High</option>
<option value="high">Price High → Low</option>
</select>

</div>

<main class="container">

<div class="top">
<h2>🛍️ Fashion Collection</h2>
<span id="count"></span>
</div>

<div class="products" id="products"></div>

</main>

<!-- CART -->

<div class="cart" id="cart">

<div class="cart-head">

<h2>🛒 Cart</h2>

<button class="close" onclick="closeCart()">×</button>

</div>

<div class="cart-list" id="cartList"></div>

<div class="cart-footer">

<div class="total">
<span>Total</span>
<span id="total">0 ETB</span>
</div>

<button class="checkout" onclick="checkout()">
💳 Pay with Chapa
</button>

</div>

</div>

<!-- ZOOM -->

<div class="zoom" id="zoom" onclick="closeZoom()">

<div class="zoom-box" onclick="event.stopPropagation()">

<button class="zoom-close" onclick="closeZoom()">×</button>

<div id="zoomImage"></div>

<h2 id="zoomName"></h2>

<p
id="zoomPrice"
style="color:#a77d00;font-weight:bold;margin-top:7px"
></p>

</div>

</div>

<footer>

<h3>Abdii Market</h3>

<p style="margin-top:8px;color:#aaa">
Fashion • Quality • Style
</p>

<p style="margin-top:15px;color:#777">
© 2026 Abdii Market
</p>

</footer>

<script>

===================================== */

/* =====================================
   COLORS
===================================== */

const colorMap={
Black:"#111111",
White:"#eeeeee",
Red:"#b91c1c",
Blue:"#2563eb",
Green:"#15803d",
Yellow:"#eab308",
Pink:"#ec4899",
Purple:"#7e22ce",
Brown:"#78350f",
Gold:"#d4af37",
Silver:"#9ca3af"
};

const accentMap={
Black:"#444",
White:"#fff",
Red:"#ef4444",
Blue:"#60a5fa",
Green:"#4ade80",
Yellow:"#fde047",
Pink:"#f9a8d4",
Purple:"#c084fc",
Brown:"#a16207",
Gold:"#f5d76e",
Silver:"#e5e7eb"
};


/* =====================================
   PRODUCTS — 180
===================================== */

const products=[];
let id=1;

const colors=[
"Black","White","Red","Blue",
"Green","Yellow","Pink",
"Purple","Brown","Gold","Silver"
];


/* 80 CLOTHES */

for(let i=1;i<=80;i++){

const gender=i<=40?"male":"female";

const color=colors[(i-1)%colors.length];

products.push({

id:id++,

name:
gender==="male"
?`Men Fashion Shirt ${i}`
:`Women Fashion Dress ${i}`,

category:"clothes",

gender,

color,

price:3000+(i%15)*500,

type:"clothes"

});

}


/* 20 SHOES */

for(let i=1;i<=20;i++){

products.push({

id:id++,

name:
i<=10
?`Men Shoes ${i}`
:`Women Shoes ${i}`,

category:"shoes",

gender:i<=10?"male":"female",

color:colors[i%colors.length],

price:4500+(i%8)*500,

type:"shoes"

});

}


/* 20 PANTS */

for(let i=1;i<=20;i++){

products.push({

id:id++,

name:
i<=10
?`Men Pant ${i}`
:`Women Pant ${i}`,

category:"pants",

gender:i<=10?"male":"female",

color:colors[(i+2)%colors.length],

price:5000+(i%7)*500,

type:"pants"

});

}


/* 20 GLASSES */

for(let i=1;i<=20;i++){

products.push({

id:id++,

name:
i<=10
?`Men Eye Glass ${i}`
:`Women Eye Glass ${i}`,

category:"glasses",

gender:i<=10?"male":"female",

color:colors[(i+3)%colors.length],

price:2500+(i%6)*500,

type:"glasses"

});

}


/* 20 WATCH */

for(let i=1;i<=20;i++){

products.push({

id:id++,

name:
i<=10
?`Men Watch ${i}`
:`Women Watch ${i}`,

category:"watch",

gender:i<=10?"male":"female",

color:colors[(i+4)%colors.length],

price:7000+(i%8)*1000,

type:"watch"

});

}


/* 10 NECKLACE */

for(let i=1;i<=10;i++){

products.push({

id:id++,

name:`Fashion Necklace ${i}`,

category:"necklace",

gender:i%2?"male":"female",

color:i%2?"Gold":"Silver",

price:6000+(i%5)*1000,

type:"necklace"

});

}


/* 10 BAG */

for(let i=1;i<=10;i++){

products.push({

id:id++,

name:`Fashion Bag ${i}`,

category:"bag",

gender:"female",

color:colors[(i+5)%colors.length],

price:4500+(i%6)*1000,

type:"bag"

});

}


/* =====================================
   CART
===================================== */

let cart=
JSON.parse(
localStorage.getItem("abdiiCart")
)||[];


/* =====================================
   RENDER
===================================== */

function render(){

const search=
document.getElementById("search")
.value.toLowerCase();

const category=
document.getElementById("category").value;

const gender=
document.getElementById("gender").value;

const color=
document.getElementById("color").value;

const sort=
document.getElementById("sort").value;

let list=products.filter(p=>{

const text=
`${p.name} ${p.category} ${p.gender} ${p.color}`
.toLowerCase();

return text.includes(search)
&&
(category==="all"||p.category===category)
&&
(gender==="all"||p.gender===gender)
&&
(color==="all"||p.color===color);

});

if(sort==="low")
list.sort((a,b)=>a.price-b.price);

if(sort==="high")
list.sort((a,b)=>b.price-a.price);

document.getElementById("count")
.textContent=list.length+" products";

const box=
document.getElementById("products");

box.innerHTML="";

list.forEach(p=>{

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div
class="product-img"
onclick="zoomProduct(${p.id})"
>

<div class="badge">
${p.gender==="male"?"MEN":"WOMEN"}
</div>

${fashionSVG(p.type,p.color)}

</div>

<div class="body">

<div class="category">
${p.category.toUpperCase()}
</div>

<div class="name">
${p.name}
</div>

<div class="price">
${p.price.toLocaleString()} ETB
</div>

<div class="tags">

<span class="tag">
${p.gender}
</span>

<span class="tag">
${p.color}
</span>

</div>

<button
class="add"
onclick="addCart(${p.id})"
>
🛒 Add to Cart
</button>

</div>
`;

box.appendChild(card);

});

}


/* =====================================
   CART FUNCTIONS
===================================== */

function addCart(id){

const p=
products.find(x=>x.id===id);

const old=
cart.find(x=>x.id===id);

if(old){

old.qty++;

}else{

cart.push({

id:p.id,
name:p.name,
price:p.price,
type:p.type,
color:p.color,
qty:1

});

}

saveCart();
updateCart();
openCart();

}

function saveCart(){

localStorage.setItem(
"abdiiCart",
JSON.stringify(cart)
);

}

function updateCart(){

const box=
document.getElementById("cartList");

box.innerHTML="";

let total=0;
let count=0;

cart.forEach(item=>{

total+=item.price*item.qty;
count+=item.qty;

const div=
document.createElement("div");

div.className="cart-item";

div.innerHTML=`

<div style="width:65px;height:65px">
${fashionSVG(item.type,item.color)}
</div>

<div class="cart-info">

<strong>${item.name}</strong>

<div>
${item.price.toLocaleString()} ETB
</div>

<div class="qty">

<button
onclick="changeQty(${item.id},-1)"
>−</button>

function changeQty(id,n){

const item=
cart.find(x=>x.id===id);

if(!item)return;

item.qty+=n;

if(item.qty<=0){

cart=
cart.filter(x=>x.id!==id);

}

saveCart();
updateCart();

}

function removeItem(id){

cart=
cart.filter(x=>x.id!==id);

saveCart();
updateCart();

}
