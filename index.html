<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdii Market — Fashion Store</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f5f7;
  color:#111;
  padding-bottom:75px;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#111;
  color:white;
  padding:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.25);
}

.header{
  max-width:1200px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.logo span{
  color:#00d26a;
}

.cart{
  position:relative;
  font-size:27px;
  cursor:pointer;
}

.cart-count{
  position:absolute;
  top:-8px;
  right:-9px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#00d26a;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
}

.search{
  margin-top:13px;
}

.search input{
  width:100%;
  padding:14px 17px;
  border:0;
  outline:0;
  border-radius:12px;
  font-size:15px;
}

.hero{
  max-width:1200px;
  margin:18px auto;
  padding:32px 20px;
  border-radius:20px;
  color:white;
  background:
  linear-gradient(
    135deg,
    rgba(0,0,0,.94),
    rgba(30,30,30,.88)
  );
}

.hero h1{
  font-size:31px;
  margin-bottom:10px;
}

.hero p{
  color:#ccc;
  line-height:1.5;
}

.hero-btn{
  margin-top:18px;
  border:0;
  padding:12px 20px;
  border-radius:10px;
  background:#00d26a;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

.section{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.title h2{
  font-size:21px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:5px;
}

.category{
  min-width:90px;
  border:0;
  background:white;
  padding:13px 10px;
  border-radius:14px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.category.active{
  background:#111;
  color:white;
}

.category-icon{
  font-size:27px;
}

.category-name{
  margin-top:5px;
  font-size:12px;
  font-weight:bold;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.product{
  background:white;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 3px 13px rgba(0,0,0,.08);
}

.product-image{
  height:190px;
  position:relative;
  overflow:hidden;
  background:#eee;
  cursor:zoom-in;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .35s ease;
}

.product-image:hover img{
  transform:scale(1.08);
}

.zoom{
  position:absolute;
  right:8px;
  bottom:8px;
  background:rgba(0,0,0,.65);
  color:white;
  width:33px;
  height:33px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.badge{
  position:absolute;
  top:8px;
  left:8px;
  background:#111;
  color:white;
  padding:5px 8px;
  border-radius:8px;
  font-size:10px;
  font-weight:bold;
}

.product-info{
  padding:12px;
}

.product-name{
  font-size:14px;
  font-weight:bold;
  min-height:35px;
}

.product-meta{
  color:#777;
  font-size:11px;
  margin:5px 0;
}

.price{
  color:#00a94f;
  font-size:17px;
  font-weight:900;
  margin:8px 0;
}

.add{
  width:100%;
  border:0;
  padding:10px;
  border-radius:9px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add:hover{
  background:#00d26a;
  color:#111;
}

/* IMAGE ZOOM */

.image-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:5000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.image-modal.show{
  display:flex;
}

.image-modal img{
  max-width:95%;
  max-height:85vh;
  object-fit:contain;
  border-radius:15px;
}

.image-close{
  position:absolute;
  top:20px;
  right:20px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:white;
  font-size:25px;
  cursor:pointer;
}

/* CART */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:4000;
  background:rgba(0,0,0,.65);
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#eee;
  font-size:22px;
  cursor:pointer;
}

.cart-item{
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-image{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:10px;
}

.cart-info{
  flex:1;
}

.cart-name{
  font-weight:bold;
  font-size:14px;
}

.cart-price{
  color:#00a94f;
  margin-top:4px;
  font-size:13px;
}

.qty{
  display:flex;
  gap:7px;
  align-items:center;
  margin-top:7px;
}

.qty button{
  width:29px;
  height:29px;
  border:0;
  border-radius:7px;
  background:#111;
  color:white;
  cursor:pointer;
}

.remove{
  border:0;
  background:#ff3b30;
  color:white;
  padding:7px 9px;
  border-radius:7px;
  cursor:pointer;
}

.total{
  font-size:21px;
  font-weight:bold;
  margin:20px 0;
}

.checkout{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#00d26a;
  color:#111;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

/* FORM */

.form{
  margin-top:15px;
}

.form input,
.form textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  margin-bottom:10px;
  outline:0;
  font-size:15px;
}

.form textarea{
  min-height:80px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px 10px;
  color:#777;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:67px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:3000;
}

.nav{
  text-align:center;
  font-size:11px;
  color:#777;
  cursor:pointer;
}

.nav-icon{
  font-size:23px;
  margin-bottom:2px;
}

.nav.active{
  color:#00a94f;
  font-weight:bold;
}

@media(min-width:700px){

  .products{
    grid-template-columns:repeat(4,1fr);
  }

  .bottom{
    display:none;
  }

  body{
    padding-bottom:20px;
  }

  .modal{
    align-items:center;
  }

  .modal-box{
    border-radius:20px;
  }
}

@media(min-width:1000px){

  .products{
    grid-template-columns:repeat(5,1fr);
  }
}
</style>
</head>

/* =====================================================

===================================================== */

/* =====================================================
   CART
===================================================== */

let cart =
JSON.parse(
  localStorage.getItem(
    "abdiiMarketCart"
  ) || "[]"
);

let currentCategory = "All";


function saveCart(){

  localStorage.setItem(
    "abdiiMarketCart",
    JSON.stringify(cart)
  );

}


function formatPrice(price){

  return Number(price)
    .toLocaleString("en-US");

}


/* =====================================================
   RENDER
===================================================== */

function renderProducts(){

  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase()
    .trim();


  const results =
    productsData.filter(product=>{

      const categoryOK =
        currentCategory === "All" ||
        product.category ===
        currentCategory;


      const text =
        (
          product.name +
          " " +
          product.gender +
          " " +
          product.color +
          " " +
          product.category
        )
        .toLowerCase();


      return (
        categoryOK &&
        text.includes(search)
      );

    });


  const container =
    document.getElementById(
      "products"
    );


  if(results.length===0){

    container.innerHTML = `
      <div class="empty">
        <h3>❌ Product hin argamne</h3>
        <p>Search kee jijjiiri.</p>
      </div>
    `;

    return;

  }


  container.innerHTML =
    results.map(product=>`

      <div class="product">

        <div
          class="product-image"
          onclick="zoomImage('${product.image}')"
        >

          <span class="badge">
            ${product.gender}
          </span>

          <img
            src="${product.image}"
            alt="${product.name}"
            loading="lazy"
            onerror="
              this.src='https://picsum.photos/600/700?random=${product.id}'
            "
          >

          <span class="zoom">
            🔍
          </span>

        </div>

        <div class="product-info">

          <div class="product-name">
            ${product.name}
          </div>

          <div class="product-meta">
            ${product.category}
            •
            ${product.color}
          </div>

          <div class="price">
            ${formatPrice(product.price)}
            ETB
          </div>

          <button
            class="add"
            onclick="addToCart(${product.id})"
          >
            🛒 Add to Cart
          </button>

        </div>

      </div>

    `).join("");

}

/* =====================================================
   CART
===================================================== */

function addToCart(id){

  const product =
    productsData.find(
      p=>p.id===id
    );

  if(!product)return;


  const existing =
    cart.find(
      item=>item.id===id
    );


  if(existing){

    existing.quantity++;

  }else{

    cart.push({

      id:product.id,

      quantity:1

    });

  }


  saveCart();

  updateCart();

  alert(
    product.name +
    " 🛒 cart keessa gale!"
  );

}


function updateCart(){

  const count =
    cart.reduce(
      (sum,item)=>
        sum+item.quantity,
      0
    );

  document.getElementById(
    "cartCount"
  ).textContent =
    count;

}


function openCart(){

  document.getElementById(
    "cartModal"
  ).classList.add("show");

  renderCart();

}


function closeCart(){

  document.getElementById(
    "cartModal"
  ).classList.remove("show");

}


function renderCart(){

  const container =
    document.getElementById(
      "cartItems"
    );


  if(cart.length===0){

    container.innerHTML=`
      <div class="empty">
        🛒 Cart kee duwwaa dha.
      </div>
    `;

    document.getElementById(
      "cartTotal"
    ).textContent="0";

    return;

  }


  let total=0;


  container.innerHTML =
    cart.map((item,index)=>{

      const product =
        productsData.find(
          p=>p.id===item.id
        );

      if(!product)return "";


      const subtotal =
        product.price *
        item.quantity;


      total += subtotal;


      return `

        <div class="cart-item">

          <img
            class="cart-image"
            src="${product.image}"
            alt="${product.name}"
          >

          <div class="cart-info">

            <div class="cart-name">
              ${product.name}
            </div>

            <div class="cart-price">
              ${formatPrice(product.price)}
              ETB
            </div>

            <div class="qty">

              <button
                onclick="changeQty(${index},-1)"
              >
                −
              </button>

              <strong>
                ${item.quantity}
              </strong>

              <button
                onclick="changeQty(${index},1)"
              >
                +
              </button>

            </div>

          </div>

          <button
            class="remove"
            onclick="removeCart(${index})"
          >
            Haqi
          </button>

        </div>

      `;

    }).join("");


  document.getElementById(
    "cartTotal"
  ).textContent =
    formatPrice(total);

}


function changeQty(index,change){

  if(!cart[index])return;


  cart[index].quantity +=
    change;


  if(cart[index].quantity<=0){

    cart.splice(index,1);

  }


  saveCart();

  updateCart();

  renderCart();

}


function removeCart(index){

  cart.splice(index,1);

  saveCart();

  updateCart();

  renderCart();

}


function getCartTotal(){

  return cart.reduce(
    (total,item)=>{

      const product =
        productsData.find(
          p=>p.id===item.id
        );

      if(!product)return total;

      return total +
        product.price *
        item.quantity;

    },
    0
  );

}

/* =====================================================
   PAYMENT
===================================================== */

async function startPayment(){

  const firstName =
    document.getElementById(
      "firstName"
    ).value.trim();

  const lastName =
    document.getElementById(
      "lastName"
    ).value.trim();

  const phone =
    document.getElementById(
      "phone"
    ).value.trim();

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const address =
    document.getElementById(
      "address"
    ).value.trim();


  if(
    !firstName ||
    !lastName ||
    !phone ||
    !address
  ){

    alert(
      "Maqaa, bilbila fi teessoo guuti."
    );

    return;

  }


  const order = {

    orderId:
      "ABD-" +
      Date.now(),

    customer:{
      firstName,
      lastName,
      phone,
      email,
      address
    },

    items:
      cart,

    amount:
      getCartTotal(),

    currency:
      "ETB",

    createdAt:
      new Date().toISOString()

  };


  localStorage.setItem(
    "abdiiLastOrder",
    JSON.stringify(order)
  );


  const button =
    document.getElementById(
      "payButton"
    );


  button.disabled=true;

  button.innerText =
    "⏳ Chapa waliin wal qunnamaa...";


  try{

    const response =
      await fetch(
        PAYMENT_ENDPOINT,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json",
            "Accept":
              "application/json"
          },

          body:
            JSON.stringify(order)

        }
      );


    const data =
      await response.json();


    if(
      !response.ok
    ){

      throw new Error(
        data.message ||
        data.error ||
        "Payment server error"
      );

    }


    if(
      data.success &&
      data.checkout_url
    ){

      window.location.href =
        data.checkout_url;

      return;

    }


    throw new Error(
      data.message ||
      "Checkout URL hin argamne."
    );


  }catch(error){

    console.error(error);


    alert(
      "Payment jalqabuu hin dandeenye.\n\n" +
      (
        error.message ||
        "Mee irra deebi'i."
      )
    );


    button.disabled=false;

    button.innerText =
      "💳 Pay Now";

  }

}
